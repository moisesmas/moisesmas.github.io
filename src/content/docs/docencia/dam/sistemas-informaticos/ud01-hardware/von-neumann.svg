<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330" width="720" height="330" role="img" aria-labelledby="t">
<title id="t">Arquitectura de Von Neumann: la CPU (unitat de control, ALU i registres) es comunica per busos amb una única memòria que guarda instruccions i dades; l'entrada i l'eixida connecten amb l'exterior i l'emmagatzematge amb la memòria.</title>
<rect width="720" height="330" fill="#ffffff"/>
<style>
text{font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;fill:#16201b;font-size:14px}
.b{font-weight:700}.s{font-size:12px;fill:#56655d}.c{text-anchor:middle}.t{font-size:16px;font-weight:700}
</style>
<defs>
<marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1f5244"/></marker>
</defs>
<rect x="16" y="40" width="150" height="74" rx="8" fill="#e2ebfa" stroke="#2764c9" stroke-width="2" /><text x="91" y="72" class="c b">Entrada</text><text x="91" y="94" class="c s">teclat, ratolí, escàner</text>
<rect x="16" y="214" width="150" height="74" rx="8" fill="#e2ebfa" stroke="#2764c9" stroke-width="2" /><text x="91" y="246" class="c b">Eixida</text><text x="91" y="268" class="c s">pantalla, impressora</text>
<rect x="222" y="24" width="250" height="270" rx="8" fill="#fbeed8" stroke="#b86e00" stroke-width="2" /><text x="347" y="52" class="c t">CPU</text>
<rect x="244" y="68" width="206" height="52" rx="8" fill="#ffffff" stroke="#b86e00" stroke-width="2" /><text x="347" y="99" class="c b">Unitat de control</text>
<rect x="244" y="138" width="206" height="52" rx="8" fill="#ffffff" stroke="#b86e00" stroke-width="2" /><text x="347" y="169" class="c b">ALU</text>
<rect x="244" y="208" width="206" height="52" rx="8" fill="#ffffff" stroke="#b86e00" stroke-width="2" /><text x="347" y="239" class="c b">Registres</text>
<rect x="542" y="24" width="162" height="156" rx="8" fill="#dcf2ed" stroke="#0a8a74" stroke-width="2" /><text x="623" y="50" class="c t">Memòria</text>
<rect x="558" y="62" width="130" height="36" rx="8" fill="#ffffff" stroke="#0a8a74" stroke-width="2" /><text x="623" y="85" class="c b">Instruccions</text>
<rect x="558" y="108" width="130" height="36" rx="8" fill="#ffffff" stroke="#0a8a74" stroke-width="2" /><text x="623" y="131" class="c b">Dades</text>
<text x="623" y="166" class="c s">la mateixa memòria, en binari</text>
<rect x="542" y="220" width="162" height="74" rx="8" fill="#ece4f8" stroke="#7446c4" stroke-width="2" /><text x="623" y="252" class="c b">Emmagatzematge</text><text x="623" y="274" class="c s">disc SSD o HDD</text>
<line x1="166" y1="77" x2="222" y2="77" stroke="#1f5244" stroke-width="2" marker-end="url(#ar)"/>
<line x1="222" y1="251" x2="166" y2="251" stroke="#1f5244" stroke-width="2" marker-end="url(#ar)"/>
<line x1="472" y1="110" x2="542" y2="110" stroke="#1f5244" stroke-width="2" marker-start="url(#ar)" marker-end="url(#ar)"/><text x="507" y="100" class="c s">busos</text>
<line x1="623" y1="180" x2="623" y2="220" stroke="#1f5244" stroke-width="2" marker-start="url(#ar)" marker-end="url(#ar)"/>
<text x="360" y="316" class="c s">El programa i les dades viuen en la mateixa memòria.</text>
</svg>
