<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 470" width="1100" height="470" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="24" role="img" aria-labelledby="t d">
<title id="t">Qué alimenta cada conector de la fuente</title>
<desc id="d">La fuente de alimentación, que convierte los 230 V de la red en 12 V, 5 V y 3,3 V, alimenta cuatro componentes con conectores distintos: la placa base con el ATX de 24 pines, el procesador con el EPS12V de 4 u 8 pines, la tarjeta gráfica con PCIe de 6 u 8 pines o 12VHPWR, y los discos con SATA de alimentación.</desc>
<defs><marker id="flecha" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#56655d"/></marker></defs>
<rect width="1100" height="470" fill="#ffffff"/>
<rect x="20" y="20" width="300" height="430" rx="8" fill="#fbeed8" stroke="#b86e00" stroke-width="2"/>
<text x="170.0" y="201.0" text-anchor="middle" fill="#16201b" font-weight="700">Fuente de</text>
<text x="170.0" y="229.0" text-anchor="middle" fill="#16201b">alimentación</text>
<text x="170.0" y="257.0" text-anchor="middle" fill="#16201b">230 V →</text>
<text x="170.0" y="285.0" text-anchor="middle" fill="#16201b">12 V · 5 V · 3,3 V</text>
<rect x="540" y="20" width="540" height="94" rx="8" fill="#e3ece7" stroke="#1f5244" stroke-width="2"/>
<text x="810.0" y="61.0" text-anchor="middle" fill="#16201b" font-weight="700">Placa base</text>
<text x="810.0" y="89.0" text-anchor="middle" fill="#16201b">ATX · 24 pines</text>
<line x1="322" y1="235" x2="538" y2="67" stroke="#56655d" stroke-width="3" marker-end="url(#flecha)"/>
<rect x="540" y="138" width="540" height="94" rx="8" fill="#e3ece7" stroke="#1f5244" stroke-width="2"/>
<text x="810.0" y="179.0" text-anchor="middle" fill="#16201b" font-weight="700">Procesador</text>
<text x="810.0" y="207.0" text-anchor="middle" fill="#16201b">EPS12V · 4 u 8 pines</text>
<line x1="322" y1="235" x2="538" y2="185" stroke="#56655d" stroke-width="3" marker-end="url(#flecha)"/>
<rect x="540" y="256" width="540" height="94" rx="8" fill="#e3ece7" stroke="#1f5244" stroke-width="2"/>
<text x="810.0" y="297.0" text-anchor="middle" fill="#16201b" font-weight="700">Tarjeta gráfica</text>
<text x="810.0" y="325.0" text-anchor="middle" fill="#16201b">PCIe · 6 u 8 pines · 12VHPWR</text>
<line x1="322" y1="235" x2="538" y2="303" stroke="#56655d" stroke-width="3" marker-end="url(#flecha)"/>
<rect x="540" y="374" width="540" height="94" rx="8" fill="#e3ece7" stroke="#1f5244" stroke-width="2"/>
<text x="810.0" y="415.0" text-anchor="middle" fill="#16201b" font-weight="700">Discos HDD y SSD</text>
<text x="810.0" y="443.0" text-anchor="middle" fill="#16201b">SATA · 15 pines</text>
<line x1="322" y1="235" x2="538" y2="421" stroke="#56655d" stroke-width="3" marker-end="url(#flecha)"/>
</svg>
