<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 450" width="1100" height="450" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="24" role="img" aria-labelledby="t d">
<title id="t">Factores de forma de la placa base y chasis compatibles</title>
<desc id="d">Tres rectángulos encajados desde una esquina: la placa ATX (305 por 244 mm) es la más grande, la microATX (244 por 244 mm) cabe dentro y la Mini-ITX (170 por 170 mm) es la más pequeña. A la derecha, el chasis compatible con cada una: la ATX, torre completa y semitorre; la microATX, semitorre y minitorre; la Mini-ITX, minitorre y SFF.</desc>
<defs><marker id="flecha" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#56655d"/></marker></defs>
<rect width="1100" height="450" fill="#ffffff"/>
<rect x="20" y="30" width="488" height="390" rx="8" fill="#f2f4ef" stroke="#56655d" stroke-width="2"/>
<rect x="20" y="30" width="390" height="390" rx="8" fill="#e3ece7" stroke="#1f5244" stroke-width="2"/>
<rect x="20" y="30" width="272" height="272" rx="8" fill="#fbeed8" stroke="#b86e00" stroke-width="2"/>
<text x="459.0" y="75" text-anchor="middle" fill="#16201b" font-weight="700">ATX</text>
<text x="341.40000000000003" y="75" text-anchor="middle" fill="#16201b" font-weight="700">mATX</text>
<text x="156.0" y="174.0" text-anchor="middle" fill="#16201b" font-weight="700">Mini-ITX</text>
<rect x="580" y="40" width="500" height="110" rx="8" fill="#f2f4ef" stroke="#56655d" stroke-width="2"/>
<text x="830.0" y="89.0" text-anchor="middle" fill="#16201b" font-weight="700">ATX · 305 × 244 mm</text>
<text x="830.0" y="117.0" text-anchor="middle" fill="#16201b">Torre completa, semitorre</text>
<rect x="580" y="180" width="500" height="110" rx="8" fill="#e3ece7" stroke="#1f5244" stroke-width="2"/>
<text x="830.0" y="229.0" text-anchor="middle" fill="#16201b" font-weight="700">microATX · 244 × 244 mm</text>
<text x="830.0" y="257.0" text-anchor="middle" fill="#16201b">Semitorre, minitorre</text>
<rect x="580" y="320" width="500" height="110" rx="8" fill="#fbeed8" stroke="#b86e00" stroke-width="2"/>
<text x="830.0" y="369.0" text-anchor="middle" fill="#16201b" font-weight="700">Mini-ITX · 170 × 170 mm</text>
<text x="830.0" y="397.0" text-anchor="middle" fill="#16201b">Minitorre, SFF</text>
</svg>
