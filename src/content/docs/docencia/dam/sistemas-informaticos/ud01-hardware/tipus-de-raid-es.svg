<text x="964.0" y="82" text-anchor="middle" fill="#16201b">Espejos repartidos</text>
<rect x="845.0" y="102" width="52" height="150" rx="6" fill="#fbeed8" stroke="#b86e00" stroke-width="2"/>
<text x="871.0" y="137" text-anchor="middle" fill="#16201b">A</text>
<text x="871.0" y="185" text-anchor="middle" fill="#16201b">C</text>
<text x="871.0" y="233" text-anchor="middle" fill="#16201b">E</text>
<rect x="907.0" y="102" width="52" height="150" rx="6" fill="#fbeed8" stroke="#b86e00" stroke-width="2"/>
<text x="933.0" y="137" text-anchor="middle" fill="#16201b">A</text>
<text x="933.0" y="185" text-anchor="middle" fill="#16201b">C</text>
