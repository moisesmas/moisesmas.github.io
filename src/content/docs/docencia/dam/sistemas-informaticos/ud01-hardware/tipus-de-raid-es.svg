<text x="167.0" y="137" text-anchor="middle" fill="#16201b">B</text>
<text x="167.0" y="185" text-anchor="middle" fill="#16201b">D</text>
<text x="167.0" y="233" text-anchor="middle" fill="#16201b">F</text>
<text x="136.0" y="290" text-anchor="middle" fill="#16201b" font-weight="700">Útil: n × S</text>
<text x="136.0" y="322" text-anchor="middle" fill="#16201b">Tolera: ninguno</text>
<rect x="283" y="10" width="258" height="330" rx="10" fill="#ffffff" stroke="#56655d" stroke-width="2"/>
<text x="412.0" y="50" text-anchor="middle" fill="#16201b" font-size="28" font-weight="700">RAID 1</text>
