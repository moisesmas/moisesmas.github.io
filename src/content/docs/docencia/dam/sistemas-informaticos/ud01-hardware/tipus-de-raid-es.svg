<text x="1057.0" y="137" text-anchor="middle" fill="#16201b">B</text>
<text x="1057.0" y="185" text-anchor="middle" fill="#16201b">D</text>
<text x="1057.0" y="233" text-anchor="middle" fill="#16201b">F</text>
<text x="964.0" y="290" text-anchor="middle" fill="#16201b" font-weight="700">Útil: (n ÷ 2) × S</text>
<text x="964.0" y="322" text-anchor="middle" fill="#16201b">Tolera: 1 seguro</text>
<rect x="250" y="358" width="600" height="50" rx="25.0" fill="#ffffff" stroke="#b86e00" stroke-width="2"/>
<text x="550.0" y="391.0" text-anchor="middle" fill="#5c3700" font-weight="700">El RAID no es una copia de seguridad</text>
