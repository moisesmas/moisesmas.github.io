<text x="443.0" y="233" text-anchor="middle" fill="#16201b">C</text>
<text x="412.0" y="290" text-anchor="middle" fill="#16201b" font-weight="700">Útil: S</text>
<text x="412.0" y="322" text-anchor="middle" fill="#16201b">Tolera: 1 disco</text>
<rect x="559" y="10" width="258" height="330" rx="10" fill="#ffffff" stroke="#56655d" stroke-width="2"/>
