<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 420" width="1100" height="420" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="24" role="img" aria-labelledby="t d">
<title id="t">Los niveles de RAID más habituales</title>
<desc id="d">Cuatro columnas con discos dibujados. RAID 0 reparte los datos en dos discos: capacidad n por S y ninguna caída tolerada. RAID 1 duplica los datos en dos discos: capacidad S y tolera un disco. RAID 5 reparte datos y paridad en tres discos: capacidad n menos 1 por S y tolera un disco. RAID 10 combina dos espejos repartidos en cuatro discos: capacidad n entre 2 por S y tolera un disco con seguridad.</desc>
<defs><marker id="flecha" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#56655d"/></marker></defs>
<rect width="1100" height="420" fill="#ffffff"/>
<rect x="7" y="10" width="258" height="330" rx="10" fill="#ffffff" stroke="#56655d" stroke-width="2"/>
<text x="136.0" y="50" text-anchor="middle" fill="#16201b" font-size="28" font-weight="700">RAID 0</text>
<text x="136.0" y="82" text-anchor="middle" fill="#16201b">Reparte</text>
<rect x="79.0" y="102" width="52" height="150" rx="6" fill="#fbeed8" stroke="#b86e00" stroke-width="2"/>
<text x="105.0" y="137" text-anchor="middle" fill="#16201b">A</text>
<text x="105.0" y="185" text-anchor="middle" fill="#16201b">C</text>
<text x="105.0" y="233" text-anchor="middle" fill="#16201b">E</text>
