<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 470" width="1100" height="470" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="24" role="img" aria-labelledby="t d">
<title id="t">Por dentro de una CPU</title>
<desc id="d">La CPU, dibujada como una caja grande, contiene la unidad de control, que decide qué hay que hacer, y la ALU, que calcula y compara; debajo, los registros, los más rápidos y de pocos bytes, y la memoria caché L1, L2 y L3, que guarda copias de lo usado hace poco. Fuera de la CPU, conectada a la caché, está la RAM, más grande y más lenta.</desc>
<defs><marker id="flecha" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#56655d"/></marker></defs>
<rect width="1100" height="470" fill="#ffffff"/>
<rect x="20" y="20" width="700" height="430" rx="12" fill="#e3ece7" stroke="#1f5244" stroke-width="2"/>
<text x="370" y="58" text-anchor="middle" fill="#16201b" font-size="28" font-weight="700">CPU</text>
<rect x="50" y="80" width="300" height="100" rx="8" fill="#fbeed8" stroke="#b86e00" stroke-width="2"/>
<text x="200.0" y="124.0" text-anchor="middle" fill="#16201b" font-weight="700">Unidad de control</text>
<text x="200.0" y="152.0" text-anchor="middle" fill="#16201b">decide qué hacer</text>
<rect x="390" y="80" width="300" height="100" rx="8" fill="#fbeed8" stroke="#b86e00" stroke-width="2"/>
<text x="540.0" y="124.0" text-anchor="middle" fill="#16201b" font-weight="700">ALU</text>
<text x="540.0" y="152.0" text-anchor="middle" fill="#16201b">calcula y compara</text>
<line x1="352" y1="130" x2="388" y2="130" stroke="#56655d" stroke-width="3"/>
<rect x="50" y="215" width="640" height="100" rx="8" fill="#ffffff" stroke="#56655d" stroke-width="2"/>
<text x="370.0" y="259.0" text-anchor="middle" fill="#16201b" font-weight="700">Registros</text>
<text x="370.0" y="287.0" text-anchor="middle" fill="#16201b">pocos bytes, los más rápidos</text>
<rect x="50" y="345" width="640" height="100" rx="8" fill="#ffffff" stroke="#56655d" stroke-width="2"/>
<text x="370.0" y="389.0" text-anchor="middle" fill="#16201b" font-weight="700">Memoria caché L1 · L2 · L3</text>
<text x="370.0" y="417.0" text-anchor="middle" fill="#16201b">copias de lo usado hace poco</text>
<line x1="370" y1="182" x2="370" y2="213" stroke="#56655d" stroke-width="3" marker-end="url(#flecha)"/>
<line x1="370" y1="317" x2="370" y2="343" stroke="#56655d" stroke-width="3" marker-end="url(#flecha)"/>
<line x1="692" y1="395" x2="788" y2="395" stroke="#56655d" stroke-width="3" marker-end="url(#flecha)"/>
<rect x="790" y="335" width="290" height="120" rx="8" fill="#f2f4ef" stroke="#56655d" stroke-width="2"/>
<text x="935.0" y="389.0" text-anchor="middle" fill="#16201b" font-weight="700">RAM</text>
<text x="935.0" y="417.0" text-anchor="middle" fill="#16201b">más grande, más lenta</text>
</svg>
