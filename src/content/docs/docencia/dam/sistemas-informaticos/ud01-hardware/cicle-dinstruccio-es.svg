<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 330" width="1100" height="330" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="24" role="img" aria-labelledby="t d">
<title id="t">El ciclo de instrucción</title>
<desc id="d">Cuatro fases en fila que vuelven al principio: fetch, la unidad de control busca la instrucción; decode, interpreta el código; execute, la ALU hace la operación; writeback, se guarda el resultado. Una flecha vuelve de la última a la primera: el ciclo se repite mientras el equipo está encendido.</desc>
<defs><marker id="flecha" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#56655d"/></marker></defs>
<rect width="1100" height="330" fill="#ffffff"/>
<rect x="1" y="20" width="235" height="130" rx="8" fill="#fbeed8" stroke="#b86e00" stroke-width="2"/>
<text x="118.5" y="65.0" text-anchor="middle" fill="#16201b" font-weight="700">Fetch</text>
<text x="118.5" y="93.0" text-anchor="middle" fill="#16201b">busca la</text>
<text x="118.5" y="121.0" text-anchor="middle" fill="#16201b">instrucción</text>
<line x1="238" y1="85" x2="285" y2="85" stroke="#56655d" stroke-width="3" marker-end="url(#flecha)"/>
<rect x="289" y="20" width="235" height="130" rx="8" fill="#fbeed8" stroke="#b86e00" stroke-width="2"/>
<text x="406.5" y="65.0" text-anchor="middle" fill="#16201b" font-weight="700">Decode</text>
<text x="406.5" y="93.0" text-anchor="middle" fill="#16201b">interpreta</text>
<text x="406.5" y="121.0" text-anchor="middle" fill="#16201b">el código</text>
<line x1="526" y1="85" x2="573" y2="85" stroke="#56655d" stroke-width="3" marker-end="url(#flecha)"/>
<rect x="577" y="20" width="235" height="130" rx="8" fill="#e3ece7" stroke="#1f5244" stroke-width="2"/>
<text x="694.5" y="65.0" text-anchor="middle" fill="#16201b" font-weight="700">Execute</text>
<text x="694.5" y="93.0" text-anchor="middle" fill="#16201b">la ALU hace</text>
<text x="694.5" y="121.0" text-anchor="middle" fill="#16201b">la operación</text>
<line x1="814" y1="85" x2="861" y2="85" stroke="#56655d" stroke-width="3" marker-end="url(#flecha)"/>
<rect x="865" y="20" width="235" height="130" rx="8" fill="#e3ece7" stroke="#1f5244" stroke-width="2"/>
<text x="982.5" y="65.0" text-anchor="middle" fill="#16201b" font-weight="700">Writeback</text>
<text x="982.5" y="93.0" text-anchor="middle" fill="#16201b">guarda el</text>
<text x="982.5" y="121.0" text-anchor="middle" fill="#16201b">resultado</text>
<polyline points="982.5,152 982.5,215 118.5,215 118.5,154" fill="none" stroke="#56655d" stroke-width="3" marker-end="url(#flecha)"/>
<rect x="230" y="245" width="640" height="50" rx="25.0" fill="#ffffff" stroke="#b86e00" stroke-width="2"/>
<text x="550.0" y="278.0" text-anchor="middle" fill="#5c3700" font-weight="700">Se repite mientras el equipo está encendido</text>
</svg>
