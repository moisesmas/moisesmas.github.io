<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 400" width="1100" height="400" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="24" role="img" aria-labelledby="t d">
<title id="t">De l'encesa al sistema operatiu</title>
<desc id="d">Set passos en dues files. Primera fila: el botó d'encesa, la font envia el senyal power good, la CPU executa el microprogramari UEFI o BIOS, el POST comprova CPU, RAM i gràfica. Segona fila: el microprogramari busca un disc amb carregador segons l'ordre d'arrancada, carrega el carregador d'arrancada i este carrega el nucli del sistema operatiu. Si el POST falla, la placa avisa amb pitos, LED o un visor de codis.</desc>
<defs><marker id="flecha" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#56655d"/></marker></defs>
<rect width="1100" height="400" fill="#ffffff"/>
<rect x="1" y="30" width="240" height="110" rx="8" fill="#f2f4ef" stroke="#56655d" stroke-width="2"/>
<text x="121.0" y="79.0" text-anchor="middle" fill="#16201b" font-weight="700">1 · Botó</text>
<text x="121.0" y="107.0" text-anchor="middle" fill="#16201b">d'encesa</text>
<rect x="287" y="30" width="240" height="110" rx="8" fill="#f2f4ef" stroke="#56655d" stroke-width="2"/>
<text x="407.0" y="79.0" text-anchor="middle" fill="#16201b" font-weight="700">2 · La font</text>
<text x="407.0" y="107.0" text-anchor="middle" fill="#16201b">envia power good</text>
<rect x="573" y="30" width="240" height="110" rx="8" fill="#fbeed8" stroke="#b86e00" stroke-width="2"/>
<text x="693.0" y="79.0" text-anchor="middle" fill="#16201b" font-weight="700">3 · UEFI o BIOS</text>
<text x="693.0" y="107.0" text-anchor="middle" fill="#16201b">la CPU l'executa</text>
<rect x="859" y="30" width="240" height="110" rx="8" fill="#fbeed8" stroke="#b86e00" stroke-width="2"/>
<text x="979.0" y="79.0" text-anchor="middle" fill="#16201b" font-weight="700">4 · POST: prova</text>
<text x="979.0" y="107.0" text-anchor="middle" fill="#16201b">CPU, RAM, gràfica</text>
<rect x="1" y="200" width="240" height="110" rx="8" fill="#fbeed8" stroke="#b86e00" stroke-width="2"/>
<text x="121.0" y="249.0" text-anchor="middle" fill="#16201b" font-weight="700">5 · Ordre</text>
<text x="121.0" y="277.0" text-anchor="middle" fill="#16201b">d'arrancada</text>
<rect x="287" y="200" width="240" height="110" rx="8" fill="#e3ece7" stroke="#1f5244" stroke-width="2"/>
<text x="407.0" y="249.0" text-anchor="middle" fill="#16201b" font-weight="700">6 · Carregador</text>
<text x="407.0" y="277.0" text-anchor="middle" fill="#16201b">(bootloader)</text>
<rect x="573" y="200" width="240" height="110" rx="8" fill="#e3ece7" stroke="#1f5244" stroke-width="2"/>
<text x="693.0" y="249.0" text-anchor="middle" fill="#16201b" font-weight="700">7 · Nucli</text>
<text x="693.0" y="277.0" text-anchor="middle" fill="#16201b">del SO</text>
<line x1="243" y1="85" x2="283" y2="85" stroke="#56655d" stroke-width="3" marker-end="url(#flecha)"/>
<line x1="529" y1="85" x2="569" y2="85" stroke="#56655d" stroke-width="3" marker-end="url(#flecha)"/>
<line x1="815" y1="85" x2="855" y2="85" stroke="#56655d" stroke-width="3" marker-end="url(#flecha)"/>
<polyline points="979.0,142 979.0,170 121.0,170 121.0,198" fill="none" stroke="#56655d" stroke-width="3" marker-end="url(#flecha)"/>
<line x1="243" y1="255" x2="283" y2="255" stroke="#56655d" stroke-width="3" marker-end="url(#flecha)"/>
<line x1="529" y1="255" x2="569" y2="255" stroke="#56655d" stroke-width="3" marker-end="url(#flecha)"/>
<rect x="150" y="330" width="800" height="50" rx="25.0" fill="#ffffff" stroke="#b86e00" stroke-width="2"/>
<text x="550.0" y="363.0" text-anchor="middle" fill="#5c3700" font-weight="700">Si el POST falla: pitos, LED o visor de codis</text>
</svg>
