<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 450" width="760" height="450" role="img" aria-labelledby="t">
<title id="t">Jerarquía de memoria: de más rápida y pequeña (registros) a más lenta y grande (disco duro).</title>
<rect width="760" height="450" fill="#ffffff"/>
<style>
text{font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;fill:#16201b;font-size:14px}
.b{font-weight:700}.s{font-size:12px;fill:#56655d}.c{text-anchor:middle}.t{font-size:16px;font-weight:700}
</style>
<defs>
<marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1f5244"/></marker>
</defs>
<text x="180" y="26" class="c b">Nivel</text><text x="372" y="26" class="b">Capacidad típica</text><text x="665" y="26" class="c b">Tiempo de acceso *</text>
<rect x="130" y="40" width="100" height="42" rx="8" fill="#fbeed8" stroke="#1f5244" stroke-width="2" /><text x="180" y="66" class="c b">Registros</text><text x="372" y="66" class="s">unas pocas decenas de registros</text><text x="665" y="66" class="c b">&lt; 1 ns</text><rect x="110" y="92" width="140" height="42" rx="8" fill="#fbeed8" stroke="#1f5244" stroke-width="2" /><text x="180" y="118" class="c b">Memoria caché L1</text><text x="372" y="118" class="s">32-64 KB por núcleo</text><text x="665" y="118" class="c b">~1 ns</text><rect x="90" y="144" width="180" height="42" rx="8" fill="#fbeed8" stroke="#1f5244" stroke-width="2" /><text x="180" y="170" class="c b">Memoria caché L2</text><text x="372" y="170" class="s">0,25-2 MB por núcleo</text><text x="665" y="170" class="c b">~4 ns</text><rect x="70" y="196" width="220" height="42" rx="8" fill="#fbeed8" stroke="#1f5244" stroke-width="2" /><text x="180" y="222" class="c b">Memoria caché L3</text><text x="372" y="222" class="s">8-32 MB compartida</text><text x="665" y="222" class="c b">~12 ns</text><rect x="50" y="248" width="260" height="42" rx="8" fill="#dcf2ed" stroke="#1f5244" stroke-width="2" /><text x="180" y="274" class="c b">RAM</text><text x="372" y="274" class="s">8-64 GB</text><text x="665" y="274" class="c b">~80 ns</text><rect x="30" y="300" width="300" height="42" rx="8" fill="#e2ebfa" stroke="#1f5244" stroke-width="2" /><text x="180" y="326" class="c b">SSD NVMe</text><text x="372" y="326" class="s">0,25-4 TB</text><text x="665" y="326" class="c b">~80 µs</text><rect x="10" y="352" width="340" height="42" rx="8" fill="#e2ebfa" stroke="#1f5244" stroke-width="2" /><text x="180" y="378" class="c b">HDD</text><text x="372" y="378" class="s">1-20 TB</text><text x="665" y="378" class="c b">~10 ms</text><text x="380" y="418" class="c s">↑ Más rápida y más cara por byte   ·   ↓ Más grande y más barata por byte</text><text x="380" y="438" class="c s">* valores orientativos</text></svg>
