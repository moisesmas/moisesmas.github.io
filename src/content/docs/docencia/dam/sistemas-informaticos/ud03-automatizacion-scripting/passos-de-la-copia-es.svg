<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 350" width="1100" height="350" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="24" role="img" aria-labelledby="t d">
<title id="t">Los pasos del script de copia de seguridad</title>
<desc id="d">Cinco pasos: validar los parámetros, crear el destino si no existe, formar el nombre con la fecha, comprimir la carpeta y comprobar si ha ido bien. Si ha ido bien, se muestra el mensaje de copia creada; si no, el script termina con exit 3.</desc>
<defs><marker id="flecha" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#56655d"/></marker></defs>
<rect width="1100" height="350" fill="#ffffff"/>
<rect x="0" y="20" width="330" height="110" rx="8" fill="#f2f4ef" stroke="#56655d" stroke-width="2"/>
<text x="165.0" y="69.0" text-anchor="middle" fill="#16201b" font-weight="700">1 · Valida</text>
<text x="165.0" y="97.0" text-anchor="middle" fill="#16201b">los parámetros</text>
<rect x="385" y="20" width="330" height="110" rx="8" fill="#f2f4ef" stroke="#56655d" stroke-width="2"/>
<text x="550.0" y="69.0" text-anchor="middle" fill="#16201b" font-weight="700">2 · Crea el destino</text>
<text x="550.0" y="97.0" text-anchor="middle" fill="#16201b">si no existe</text>
<rect x="770" y="20" width="330" height="110" rx="8" fill="#f2f4ef" stroke="#56655d" stroke-width="2"/>
<text x="935.0" y="69.0" text-anchor="middle" fill="#16201b" font-weight="700">3 · Forma el nombre</text>
<text x="935.0" y="97.0" text-anchor="middle" fill="#16201b">con la fecha</text>
<rect x="0" y="190" width="330" height="110" rx="8" fill="#fbeed8" stroke="#b86e00" stroke-width="2"/>
<text x="165.0" y="239.0" text-anchor="middle" fill="#16201b" font-weight="700">4 · Comprime</text>
<text x="165.0" y="267.0" text-anchor="middle" fill="#16201b">la carpeta</text>
<rect x="385" y="190" width="330" height="110" rx="8" fill="#fbeed8" stroke="#b86e00" stroke-width="2"/>
<text x="550.0" y="239.0" text-anchor="middle" fill="#16201b" font-weight="700">5 · Comprueba</text>
<text x="550.0" y="267.0" text-anchor="middle" fill="#16201b">si ha ido bien</text>
<line x1="332" y1="75" x2="381" y2="75" stroke="#56655d" stroke-width="3" marker-end="url(#flecha)"/>
<line x1="717" y1="75" x2="766" y2="75" stroke="#56655d" stroke-width="3" marker-end="url(#flecha)"/>
<polyline points="935.0,132 935.0,160 165.0,160 165.0,188" fill="none" stroke="#56655d" stroke-width="3" marker-end="url(#flecha)"/>
<line x1="332" y1="245" x2="381" y2="245" stroke="#56655d" stroke-width="3" marker-end="url(#flecha)"/>
<rect x="770" y="190" width="330" height="50" rx="8" fill="#e3ece7" stroke="#1f5244" stroke-width="2"/>
<text x="935.0" y="223.0" text-anchor="middle" fill="#16201b">Sí: copia creada</text>
<rect x="770" y="260" width="330" height="50" rx="8" fill="#ffffff" stroke="#56655d" stroke-width="2" stroke-dasharray="8 6"/>
<text x="935.0" y="293.0" text-anchor="middle" fill="#16201b">No: exit 3</text>
<line x1="717" y1="235" x2="766" y2="215" stroke="#56655d" stroke-width="3" marker-end="url(#flecha)"/>
<line x1="717" y1="255" x2="766" y2="285" stroke="#56655d" stroke-width="3" marker-end="url(#flecha)"/>
</svg>
