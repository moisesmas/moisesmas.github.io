<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 330" width="1100" height="330" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="24" role="img" aria-labelledby="t d">
<title id="t">La trampa del codi d'eixida</title>
<desc id="d">Tres ordres seguides. mkdir /tmp/proves falla perquè la carpeta ja existix i deixa $? a 1. Després echo "Intent fet" va bé i deixa $? a 0. Per això echo $? mostra 0, no 1. Cada ordre sobreescriu $?.</desc>
<defs><marker id="flecha" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#56655d"/></marker></defs>
<rect width="1100" height="330" fill="#ffffff"/>
<rect x="25" y="30" width="310" height="90" rx="8" fill="#fbeed8" stroke="#b86e00" stroke-width="2"/>
<text x="180.0" y="83.0" text-anchor="middle" fill="#16201b" font-family="ui-monospace,Menlo,Consolas,monospace">mkdir /tmp/proves</text>
<line x1="337" y1="75" x2="391" y2="75" stroke="#56655d" stroke-width="3" marker-end="url(#flecha)"/>
<rect x="55" y="150" width="250" height="48" rx="24.0" fill="#ffffff" stroke="#b86e00" stroke-width="2"/>
<text x="180.0" y="182.0" text-anchor="middle" fill="#5c3700" font-weight="700">falla: $? = 1</text>
<rect x="395" y="30" width="310" height="90" rx="8" fill="#e3ece7" stroke="#1f5244" stroke-width="2"/>
<text x="550.0" y="83.0" text-anchor="middle" fill="#16201b" font-family="ui-monospace,Menlo,Consolas,monospace">echo "Intent fet"</text>
<line x1="707" y1="75" x2="761" y2="75" stroke="#56655d" stroke-width="3" marker-end="url(#flecha)"/>
<rect x="425" y="150" width="250" height="48" rx="24.0" fill="#ffffff" stroke="#b86e00" stroke-width="2"/>
<text x="550.0" y="182.0" text-anchor="middle" fill="#5c3700" font-weight="700">va bé: $? = 0</text>
<rect x="765" y="30" width="310" height="90" rx="8" fill="#f2f4ef" stroke="#56655d" stroke-width="2"/>
<text x="920.0" y="83.0" text-anchor="middle" fill="#16201b" font-family="ui-monospace,Menlo,Consolas,monospace">echo $?</text>
<rect x="795" y="150" width="250" height="48" rx="24.0" fill="#ffffff" stroke="#b86e00" stroke-width="2"/>
<text x="920.0" y="182.0" text-anchor="middle" fill="#5c3700" font-weight="700">mostra 0, no 1</text>
<rect x="275" y="250" width="550" height="52" rx="26.0" fill="#ffffff" stroke="#b86e00" stroke-width="2"/>
<text x="550.0" y="284.0" text-anchor="middle" fill="#5c3700" font-weight="700">Guarda'l de seguida: codi=$?</text>
</svg>
