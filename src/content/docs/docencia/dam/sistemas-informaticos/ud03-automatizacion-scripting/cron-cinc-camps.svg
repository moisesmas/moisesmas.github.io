<text x="100.0" y="87.0" text-anchor="middle" fill="#16201b">0-59</text>
<line x1="100.0" y1="112" x2="100.0" y2="148" stroke="#56655d" stroke-width="3" marker-end="url(#flecha)"/>
<rect x="5" y="150" width="190" height="60" rx="8" fill="#ffffff" stroke="#56655d" stroke-width="2"/>
<text x="100.0" y="188.0" text-anchor="middle" fill="#16201b" font-weight="700" font-family="ui-monospace,Menlo,Consolas,monospace">30</text>
