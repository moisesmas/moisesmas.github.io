<rect x="455" y="150" width="190" height="60" rx="8" fill="#ffffff" stroke="#56655d" stroke-width="2"/>
<text x="550.0" y="188.0" text-anchor="middle" fill="#16201b" font-weight="700" font-family="ui-monospace,Menlo,Consolas,monospace">*</text>
<rect x="680" y="20" width="190" height="90" rx="8" fill="#fbeed8" stroke="#b86e00" stroke-width="2"/>
<text x="775.0" y="59.0" text-anchor="middle" fill="#16201b" font-weight="700">mes</text>
<text x="775.0" y="87.0" text-anchor="middle" fill="#16201b">1-12</text>
<line x1="775.0" y1="112" x2="775.0" y2="148" stroke="#56655d" stroke-width="3" marker-end="url(#flecha)"/>
