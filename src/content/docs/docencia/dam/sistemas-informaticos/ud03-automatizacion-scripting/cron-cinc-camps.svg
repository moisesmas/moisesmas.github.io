<text x="1000.0" y="87.0" text-anchor="middle" fill="#16201b">0-7</text>
<line x1="1000.0" y1="112" x2="1000.0" y2="148" stroke="#56655d" stroke-width="3" marker-end="url(#flecha)"/>
<rect x="905" y="150" width="190" height="60" rx="8" fill="#ffffff" stroke="#56655d" stroke-width="2"/>
