<text x="285" y="394" text-anchor="start" fill="#16201b">tot</text>
<rect x="440" y="372" width="36" height="28" rx="4" fill="#e3ece7" stroke="#1f5244" stroke-width="2"/>
<text x="490" y="394" text-anchor="start" fill="#16201b">només els canvis</text>
</svg>
