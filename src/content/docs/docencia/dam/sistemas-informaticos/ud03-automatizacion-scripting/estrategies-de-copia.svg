<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 420" width="1100" height="420" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="24" role="img" aria-labelledby="t d">
<title id="t">Còpia completa, incremental i diferencial</title>
<desc id="d">Tres files i quatre dies. Completa: cada dia copia tot; per a restaurar cal un sol conjunt. Incremental: el dia 1 copia tot i després només els canvis des de l'última còpia; per a restaurar cal la completa i totes les incrementals. Diferencial: el dia 1 copia tot i després els canvis des de l'última completa, cada dia més grans; per a restaurar cal la completa i l'última diferencial.</desc>
<defs><marker id="flecha" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#56655d"/></marker></defs>
<rect width="1100" height="420" fill="#ffffff"/>
<text x="300.0" y="40" text-anchor="middle" fill="#16201b" font-weight="700">Dia 1</text>
<text x="445.0" y="40" text-anchor="middle" fill="#16201b" font-weight="700">Dia 2</text>
<text x="590.0" y="40" text-anchor="middle" fill="#16201b" font-weight="700">Dia 3</text>
<text x="735.0" y="40" text-anchor="middle" fill="#16201b" font-weight="700">Dia 4</text>
<text x="955" y="40" text-anchor="middle" fill="#16201b" font-weight="700">Per a restaurar</text>
<text x="20" y="115" text-anchor="start" fill="#16201b" font-size="28" font-weight="700">Completa</text>
<rect x="235" y="70" width="130" height="64" rx="6" fill="#ffffff" stroke="#d3dbd4" stroke-width="2"/>
<rect x="235" y="70" width="130" height="64" rx="6" fill="#fbeed8" stroke="#b86e00" stroke-width="2"/>
<rect x="380" y="70" width="130" height="64" rx="6" fill="#ffffff" stroke="#d3dbd4" stroke-width="2"/>
<rect x="380" y="70" width="130" height="64" rx="6" fill="#fbeed8" stroke="#b86e00" stroke-width="2"/>
<rect x="525" y="70" width="130" height="64" rx="6" fill="#ffffff" stroke="#d3dbd4" stroke-width="2"/>
<rect x="525" y="70" width="130" height="64" rx="6" fill="#fbeed8" stroke="#b86e00" stroke-width="2"/>
<rect x="670" y="70" width="130" height="64" rx="6" fill="#ffffff" stroke="#d3dbd4" stroke-width="2"/>
<rect x="670" y="70" width="130" height="64" rx="6" fill="#fbeed8" stroke="#b86e00" stroke-width="2"/>
<text x="955" y="110" text-anchor="middle" fill="#16201b">un sol conjunt</text>
<text x="20" y="215" text-anchor="start" fill="#16201b" font-size="28" font-weight="700">Incremental</text>
<rect x="235" y="170" width="130" height="64" rx="6" fill="#ffffff" stroke="#d3dbd4" stroke-width="2"/>
<rect x="235" y="170" width="130" height="64" rx="6" fill="#fbeed8" stroke="#b86e00" stroke-width="2"/>
<rect x="380" y="170" width="130" height="64" rx="6" fill="#ffffff" stroke="#d3dbd4" stroke-width="2"/>
<rect x="380" y="170" width="40" height="64" rx="6" fill="#e3ece7" stroke="#1f5244" stroke-width="2"/>
<rect x="525" y="170" width="130" height="64" rx="6" fill="#ffffff" stroke="#d3dbd4" stroke-width="2"/>
<rect x="525" y="170" width="30" height="64" rx="6" fill="#e3ece7" stroke="#1f5244" stroke-width="2"/>
<rect x="670" y="170" width="130" height="64" rx="6" fill="#ffffff" stroke="#d3dbd4" stroke-width="2"/>
<rect x="670" y="170" width="50" height="64" rx="6" fill="#e3ece7" stroke="#1f5244" stroke-width="2"/>
<text x="955" y="210" text-anchor="middle" fill="#16201b">completa + totes</text>
<text x="20" y="315" text-anchor="start" fill="#16201b" font-size="28" font-weight="700">Diferencial</text>
<rect x="235" y="270" width="130" height="64" rx="6" fill="#ffffff" stroke="#d3dbd4" stroke-width="2"/>
<rect x="235" y="270" width="130" height="64" rx="6" fill="#fbeed8" stroke="#b86e00" stroke-width="2"/>
<rect x="380" y="270" width="130" height="64" rx="6" fill="#ffffff" stroke="#d3dbd4" stroke-width="2"/>
<rect x="380" y="270" width="40" height="64" rx="6" fill="#e3ece7" stroke="#1f5244" stroke-width="2"/>
<rect x="525" y="270" width="130" height="64" rx="6" fill="#ffffff" stroke="#d3dbd4" stroke-width="2"/>
<rect x="525" y="270" width="80" height="64" rx="6" fill="#e3ece7" stroke="#1f5244" stroke-width="2"/>
<rect x="670" y="270" width="130" height="64" rx="6" fill="#ffffff" stroke="#d3dbd4" stroke-width="2"/>
<rect x="670" y="270" width="120" height="64" rx="6" fill="#e3ece7" stroke="#1f5244" stroke-width="2"/>
