<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 440" width="1100" height="440" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="24" role="img" aria-labelledby="t d">
<title id="t">Els tres canals d'un programa</title>
<desc id="d">Un programa té l'entrada estàndard (0), que ve del teclat i es pot redirigir amb &lt; fitxer; l'eixida estàndard (1), que va a la pantalla i es pot desviar amb &gt; fitxer; i l'eixida d'errors (2), també a la pantalla, que es desvia amb 2&gt; errors.log. Una canonada connecta l'eixida d'una ordre amb l'entrada de la següent.</desc>
<defs><marker id="flecha" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#56655d"/></marker></defs>
<rect width="1100" height="440" fill="#ffffff"/>
<rect x="15" y="135" width="290" height="110" rx="8" fill="#f2f4ef" stroke="#56655d" stroke-width="2"/>
<text x="160.0" y="170.0" text-anchor="middle" fill="#16201b" font-weight="700">Entrada (0)</text>
<text x="160.0" y="198.0" text-anchor="middle" fill="#16201b">teclat</text>
<text x="160.0" y="226.0" text-anchor="middle" fill="#16201b" font-family="ui-monospace,Menlo,Consolas,monospace">&lt; fitxer</text>
<rect x="405" y="135" width="290" height="110" rx="8" fill="#e3ece7" stroke="#1f5244" stroke-width="2"/>
<text x="550.0" y="198.0" text-anchor="middle" fill="#16201b" font-weight="700">Programa</text>
<rect x="795" y="25" width="290" height="110" rx="8" fill="#fbeed8" stroke="#b86e00" stroke-width="2"/>
<text x="940.0" y="60.0" text-anchor="middle" fill="#16201b" font-weight="700">Eixida (1)</text>
<text x="940.0" y="88.0" text-anchor="middle" fill="#16201b">pantalla</text>
<text x="940.0" y="116.0" text-anchor="middle" fill="#16201b" font-family="ui-monospace,Menlo,Consolas,monospace">&gt; fitxer</text>
<rect x="795" y="245" width="290" height="110" rx="8" fill="#fbeed8" stroke="#b86e00" stroke-width="2"/>
<text x="940.0" y="280.0" text-anchor="middle" fill="#16201b" font-weight="700">Errors (2)</text>
<text x="940.0" y="308.0" text-anchor="middle" fill="#16201b">pantalla</text>
<text x="940.0" y="336.0" text-anchor="middle" fill="#16201b" font-family="ui-monospace,Menlo,Consolas,monospace">2&gt; errors.log</text>
<line x1="307" y1="190" x2="403" y2="190" stroke="#56655d" stroke-width="3" marker-end="url(#flecha)"/>
<line x1="697" y1="165" x2="793" y2="100" stroke="#56655d" stroke-width="3" marker-end="url(#flecha)"/>
<line x1="697" y1="215" x2="793" y2="290" stroke="#56655d" stroke-width="3" marker-end="url(#flecha)"/>
<rect x="60" y="385" width="980" height="50" rx="25.0" fill="#ffffff" stroke="#b86e00" stroke-width="2"/>
<text x="550.0" y="418.0" text-anchor="middle" fill="#5c3700" font-weight="700">Canonada ( | ): l'eixida d'una ordre és l'entrada de la següent</text>
</svg>
