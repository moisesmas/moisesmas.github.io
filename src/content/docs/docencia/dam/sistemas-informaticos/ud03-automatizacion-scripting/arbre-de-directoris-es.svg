<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 450" width="1100" height="450" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="24" role="img" aria-labelledby="t d">
<title id="t">Estructura de directorios de Linux y de Windows</title>
<desc id="d">Dos árboles. Linux, desde la raíz: /etc la configuración, /home las carpetas personales, /var logs y datos variables, /usr programas y bibliotecas, /dev dispositivos y /tmp archivos temporales. Windows, desde la unidad C: Windows el sistema, Program Files los programas, Users los perfiles de usuario y ProgramData los datos comunes.</desc>
<defs><marker id="flecha" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#56655d"/></marker></defs>
