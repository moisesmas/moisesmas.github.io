<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 480" width="1100" height="480" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="24" role="img" aria-labelledby="t d">
<title id="t">Qui pot comunicar-se amb qui segons el mode de xarxa</title>
<desc id="d">Taula amb quatre modes de xarxa en columnes (NAT, adaptador pont, xarxa interna, només amfitrió) i cinc comunicacions en files. La VM cap a Internet: sí en NAT i pont, no en interna i només amfitrió. La VM cap a l'amfitrió: sí en NAT, pont i només amfitrió. L'amfitrió cap a la VM: sí en pont i només amfitrió. Entre VM: no en NAT, sí en els altres. Un altre PC de l'aula cap a la VM: només en pont.</desc>
<defs><marker id="flecha" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#56655d"/></marker></defs>
<rect width="1100" height="480" fill="#ffffff"/>
<text x="505.0" y="50" text-anchor="middle" fill="#16201b" font-size="28" font-weight="700">NAT</text>
<text x="675.0" y="50" text-anchor="middle" fill="#16201b" font-size="28" font-weight="700">Pont</text>
<text x="845.0" y="50" text-anchor="middle" fill="#16201b" font-size="28" font-weight="700">Interna</text>
<text x="1015.0" y="36" text-anchor="middle" fill="#16201b" font-size="28" font-weight="700">Només</text>
<text x="1015.0" y="66" text-anchor="middle" fill="#16201b" font-size="28" font-weight="700">amfitrió</text>
<text x="20" y="114" fill="#16201b">La VM → Internet</text>
