<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 480" width="1100" height="480" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="24" role="img" aria-labelledby="t d">
<title id="t">Quién puede comunicarse con quién según el modo de red</title>
<desc id="d">Tabla con cuatro modos de red en columnas (NAT, adaptador puente, red interna, solo anfitrión) y cinco comunicaciones en filas. La VM hacia Internet: sí en NAT y puente, no en interna y solo anfitrión. La VM hacia el anfitrión: sí en NAT, puente y solo anfitrión. El anfitrión hacia la VM: sí en puente y solo anfitrión. Entre VM: no en NAT, sí en los demás. Otro PC del aula hacia la VM: solo en puente.</desc>
<defs><marker id="flecha" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#56655d"/></marker></defs>
<rect width="1100" height="480" fill="#ffffff"/>
<text x="505.0" y="50" text-anchor="middle" fill="#16201b" font-size="28" font-weight="700">NAT</text>
<text x="675.0" y="50" text-anchor="middle" fill="#16201b" font-size="28" font-weight="700">Puente</text>
<text x="845.0" y="50" text-anchor="middle" fill="#16201b" font-size="28" font-weight="700">Interna</text>
<text x="1015.0" y="36" text-anchor="middle" fill="#16201b" font-size="28" font-weight="700">Solo</text>
<text x="1015.0" y="66" text-anchor="middle" fill="#16201b" font-size="28" font-weight="700">anfitrión</text>
<text x="20" y="114" fill="#16201b">La VM → Internet</text>
