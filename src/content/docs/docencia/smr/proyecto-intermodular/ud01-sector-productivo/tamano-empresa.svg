<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 438" width="1100" height="438" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="24" role="img" aria-labelledby="t d">
<title id="t">Tamaño de la empresa según su plantilla</title>
<desc id="d">Cuatro columnas, de menor a mayor. Microempresa: menos de 10 personas, por ejemplo un servicio técnico local. Pequeña: de 10 a menos de 50 personas, por ejemplo un proveedor de servicios gestionados. Mediana: de 50 a menos de 250 personas, por ejemplo una tienda o un distribuidor. Grande: 250 personas o más, por ejemplo un operador de telecomunicaciones. El criterio oficial añade el volumen de negocio o el balance.</desc>
<defs><marker id="flecha" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#56655d"/></marker></defs>
<rect width="1100" height="438" fill="#ffffff"/>
<rect x="20" y="20" width="250" height="70" rx="8" fill="#fbeed8" stroke="#b86e00" stroke-width="2"/>
<text x="145.0" y="64.0" text-anchor="middle" fill="#16201b" font-size="28" font-weight="700">Microempresa</text>
<line x1="145" y1="92" x2="145" y2="118" stroke="#56655d" stroke-width="3" marker-end="url(#flecha)"/>
<rect x="20" y="122" width="250" height="100" rx="8" fill="#f2f4ef" stroke="#56655d" stroke-width="2"/>
<text x="145.0" y="165.0" text-anchor="middle" fill="#16201b" font-weight="700">Menos de 10</text>
<text x="145.0" y="197.0" text-anchor="middle" fill="#16201b">personas</text>
<line x1="145" y1="224" x2="145" y2="250" stroke="#56655d" stroke-width="3" marker-end="url(#flecha)"/>
<rect x="20" y="254" width="250" height="110" rx="8" fill="#e3ece7" stroke="#1f5244" stroke-width="2"/>
<text x="145.0" y="302.0" text-anchor="middle" fill="#16201b">Servicio técnico</text>
<text x="145.0" y="334.0" text-anchor="middle" fill="#16201b">local</text>
<rect x="290" y="20" width="250" height="70" rx="8" fill="#fbeed8" stroke="#b86e00" stroke-width="2"/>
<text x="415.0" y="64.0" text-anchor="middle" fill="#16201b" font-size="28" font-weight="700">Pequeña</text>
<line x1="415" y1="92" x2="415" y2="118" stroke="#56655d" stroke-width="3" marker-end="url(#flecha)"/>
<rect x="290" y="122" width="250" height="100" rx="8" fill="#f2f4ef" stroke="#56655d" stroke-width="2"/>
<text x="415.0" y="165.0" text-anchor="middle" fill="#16201b" font-weight="700">10 a menos de 50</text>
<text x="415.0" y="197.0" text-anchor="middle" fill="#16201b">personas</text>
<line x1="415" y1="224" x2="415" y2="250" stroke="#56655d" stroke-width="3" marker-end="url(#flecha)"/>
<rect x="290" y="254" width="250" height="110" rx="8" fill="#e3ece7" stroke="#1f5244" stroke-width="2"/>
<text x="415.0" y="286.0" text-anchor="middle" fill="#16201b">Proveedor de</text>
<text x="415.0" y="318.0" text-anchor="middle" fill="#16201b">servicios</text>
<text x="415.0" y="350.0" text-anchor="middle" fill="#16201b">gestionados</text>
<rect x="560" y="20" width="250" height="70" rx="8" fill="#fbeed8" stroke="#b86e00" stroke-width="2"/>
<text x="685.0" y="64.0" text-anchor="middle" fill="#16201b" font-size="28" font-weight="700">Mediana</text>
<line x1="685" y1="92" x2="685" y2="118" stroke="#56655d" stroke-width="3" marker-end="url(#flecha)"/>
<rect x="560" y="122" width="250" height="100" rx="8" fill="#f2f4ef" stroke="#56655d" stroke-width="2"/>
<text x="685.0" y="165.0" text-anchor="middle" fill="#16201b" font-weight="700">50 a menos de 250</text>
<text x="685.0" y="197.0" text-anchor="middle" fill="#16201b">personas</text>
<line x1="685" y1="224" x2="685" y2="250" stroke="#56655d" stroke-width="3" marker-end="url(#flecha)"/>
<rect x="560" y="254" width="250" height="110" rx="8" fill="#e3ece7" stroke="#1f5244" stroke-width="2"/>
<text x="685.0" y="302.0" text-anchor="middle" fill="#16201b">Tienda o</text>
<text x="685.0" y="334.0" text-anchor="middle" fill="#16201b">distribuidor</text>
<rect x="830" y="20" width="250" height="70" rx="8" fill="#fbeed8" stroke="#b86e00" stroke-width="2"/>
<text x="955.0" y="64.0" text-anchor="middle" fill="#16201b" font-size="28" font-weight="700">Grande</text>
<line x1="955" y1="92" x2="955" y2="118" stroke="#56655d" stroke-width="3" marker-end="url(#flecha)"/>
<rect x="830" y="122" width="250" height="100" rx="8" fill="#f2f4ef" stroke="#56655d" stroke-width="2"/>
<text x="955.0" y="165.0" text-anchor="middle" fill="#16201b" font-weight="700">250 o más</text>
<text x="955.0" y="197.0" text-anchor="middle" fill="#16201b">personas</text>
<line x1="955" y1="224" x2="955" y2="250" stroke="#56655d" stroke-width="3" marker-end="url(#flecha)"/>
<rect x="830" y="254" width="250" height="110" rx="8" fill="#e3ece7" stroke="#1f5244" stroke-width="2"/>
<text x="955.0" y="302.0" text-anchor="middle" fill="#16201b">Operador de</text>
<text x="955.0" y="334.0" text-anchor="middle" fill="#16201b">telecomunicaciones</text>
<rect x="20" y="378" width="1060" height="40" rx="20" fill="#ffffff" stroke="#56655d" stroke-width="2"/>
<text x="550.0" y="407.0" text-anchor="middle" fill="#16201b">Criterio oficial: plantilla y volumen de negocio (o balance)</text>
</svg>
