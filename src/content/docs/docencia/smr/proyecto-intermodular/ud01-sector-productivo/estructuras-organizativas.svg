<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 560" width="1100" height="560" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="24" role="img" aria-labelledby="t d">
<title id="t">Cuatro estructuras organizativas</title>
<desc id="d">Cuatro esquemas. Plana: una dirección con todo el equipo en un único nivel, típica de microempresas. Funcional: una dirección, tres responsables de área y dos personas bajo cada uno, típica de pymes y tiendas. Por proyectos: una dirección y dos equipos de proyecto que se forman y se deshacen, típica de empresas de desarrollo e integradores. Matricial: una cuadrícula en la que cada persona depende a la vez de una función y de un proyecto, típica de empresas grandes.</desc>
