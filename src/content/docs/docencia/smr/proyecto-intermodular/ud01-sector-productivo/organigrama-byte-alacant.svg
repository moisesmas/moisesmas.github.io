<title id="t">Organigrama de Reparaciones Byte Alacant, empresa ficticia de cinco personas</title>
<desc id="d">Organigrama de la empresa ficticia Reparaciones Byte Alacant. Arriba, la gerencia (dirección, comercial y administración). De ella dependen el responsable técnico (soporte y sistemas) y el auxiliar administrativo (atención al cliente y facturas). Del responsable técnico dependen un técnico de taller (reparaciones en el local) y un técnico de campo (soporte en casa del cliente).</desc>
