<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 430" width="1100" height="430" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="24" role="img" aria-labelledby="t d">
<title id="t">Escalera de la economía circular</title>
<desc id="d">Cinco peldaños, de más a menos preferible: reducir (comprar solo lo necesario), reutilizar (segunda vida para el equipo), reparar y ampliar (alargar la vida útil cambiando una pieza), reciclar (recuperar materiales) y eliminar con control (lo irrecuperable se gestiona como residuo). Se prefiere siempre el peldaño de arriba.</desc>
<defs><marker id="flecha" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#56655d"/></marker></defs>
<rect width="1100" height="430" fill="#ffffff"/>
<rect x="20" y="20" width="1060" height="70" rx="8" fill="#fbeed8" stroke="#b86e00" stroke-width="2"/>
<line x1="440" y1="30" x2="440" y2="80" stroke="#b86e00" stroke-width="2"/>
<text x="44" y="65" text-anchor="start" fill="#16201b" font-size="28" font-weight="700">1. Reducir</text>
<text x="462" y="64" text-anchor="start" fill="#16201b">Comprar solo lo necesario</text>
<rect x="50" y="100" width="1030" height="70" rx="8" fill="#e3ece7" stroke="#1f5244" stroke-width="2"/>
<line x1="470" y1="110" x2="470" y2="160" stroke="#1f5244" stroke-width="2"/>
<text x="74" y="145" text-anchor="start" fill="#16201b" font-size="28" font-weight="700">2. Reutilizar</text>
<text x="492" y="144" text-anchor="start" fill="#16201b">Segunda vida: otro usuario u otra función</text>
<rect x="80" y="180" width="1000" height="70" rx="8" fill="#e3ece7" stroke="#1f5244" stroke-width="2"/>
<line x1="500" y1="190" x2="500" y2="240" stroke="#1f5244" stroke-width="2"/>
<text x="104" y="225" text-anchor="start" fill="#16201b" font-size="28" font-weight="700">3. Reparar y ampliar</text>
<text x="522" y="224" text-anchor="start" fill="#16201b">Alargar la vida útil cambiando una pieza</text>
<rect x="110" y="260" width="970" height="70" rx="8" fill="#e3ece7" stroke="#1f5244" stroke-width="2"/>
<line x1="530" y1="270" x2="530" y2="320" stroke="#1f5244" stroke-width="2"/>
<text x="134" y="305" text-anchor="start" fill="#16201b" font-size="28" font-weight="700">4. Reciclar</text>
<text x="552" y="304" text-anchor="start" fill="#16201b">Recuperar materiales cuando ya no sirve</text>
<rect x="140" y="340" width="940" height="70" rx="8" fill="#f2f4ef" stroke="#56655d" stroke-width="2"/>
<line x1="560" y1="350" x2="560" y2="400" stroke="#56655d" stroke-width="2"/>
<text x="164" y="385" text-anchor="start" fill="#16201b" font-size="28" font-weight="700">5. Eliminar con control</text>
<text x="582" y="384" text-anchor="start" fill="#16201b">Lo irrecuperable, como residuo</text>
</svg>
