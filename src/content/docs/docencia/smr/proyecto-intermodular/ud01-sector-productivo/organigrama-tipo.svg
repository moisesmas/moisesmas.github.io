<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" width="760" height="380" role="img" aria-labelledby="t">
<title id="t">Organigrama de una microempresa ficticia de cinco personas: la gerencia está arriba, de ella dependen el responsable técnico y el auxiliar administrativo, y del responsable técnico dependen dos técnicos.</title>
<rect width="760" height="380" fill="#ffffff"/>
<style>
text{font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;fill:#16201b;font-size:14px}
.b{font-weight:700}.s{font-size:12px;fill:#56655d}.c{text-anchor:middle}
.l{stroke:#1f5244;stroke-width:2;fill:none}
</style>
<text x="380" y="24" class="c b">Reparaciones Byte Alacant, S. L. (empresa ficticia)</text>

<path class="l" d="M380 100V126M380 126H180M380 126H580M180 126V150M580 126V150"/>
<path class="l" d="M180 220V246M180 246H100M180 246H290M100 246V270M290 246V270"/>

<rect x="270" y="44" width="220" height="56" rx="8" fill="#fbeed8" stroke="#1f5244" stroke-width="2"/>
<text x="380" y="68" class="c b">Gerencia</text><text x="380" y="88" class="c s">dirección, comercial, administración</text>

<rect x="70" y="150" width="220" height="70" rx="8" fill="#e9f2ee" stroke="#1f5244" stroke-width="2"/>
<text x="180" y="176" class="c b">Responsable técnico</text><text x="180" y="196" class="c s">soporte y sistemas</text><text x="180" y="212" class="c s">coordina al equipo técnico</text>

<rect x="470" y="150" width="220" height="70" rx="8" fill="#e9f2ee" stroke="#1f5244" stroke-width="2"/>
<text x="580" y="176" class="c b">Auxiliar administrativo/a</text><text x="580" y="196" class="c s">atención al cliente y facturas</text><text x="580" y="212" class="c s">media jornada</text>

<rect x="10" y="270" width="180" height="60" rx="8" fill="#ffffff" stroke="#1f5244" stroke-width="2"/>
<text x="100" y="296" class="c b">Técnico/a de taller</text><text x="100" y="316" class="c s">reparaciones en el local</text>

<rect x="200" y="270" width="180" height="60" rx="8" fill="#ffffff" stroke="#1f5244" stroke-width="2"/>
<text x="290" y="296" class="c b">Técnico/a de campo</text><text x="290" y="316" class="c s">soporte en casa del cliente</text>

<text x="550" y="300" class="s">Cada línea indica de quién</text>
<text x="550" y="318" class="s">depende cada puesto.</text>
<text x="380" y="366" class="c s">Datos inventados con fines didácticos · Plantilla: 5 personas (microempresa)</text>
</svg>
