<circle cx="405" cy="289" r="22" fill="#ffffff" stroke="#56655d" stroke-width="2"/>
<text x="405" y="298" text-anchor="middle" fill="#16201b" font-weight="700">11</text>
<text x="439" y="284" text-anchor="start" fill="#16201b">Ciudades y comunidades</text>
<text x="439" y="312" text-anchor="start" fill="#16201b">sostenibles</text>
<rect x="730" y="254" width="350" height="70" rx="8" fill="#fbeed8" stroke="#b86e00" stroke-width="2"/>
<circle cx="760" cy="289" r="22" fill="#ffffff" stroke="#b86e00" stroke-width="2"/>
<text x="760" y="298" text-anchor="middle" fill="#16201b" font-weight="700">12</text>
<text x="794" y="284" text-anchor="start" fill="#16201b">Producción y consumo</text>
<text x="794" y="312" text-anchor="start" fill="#16201b">responsables</text>
