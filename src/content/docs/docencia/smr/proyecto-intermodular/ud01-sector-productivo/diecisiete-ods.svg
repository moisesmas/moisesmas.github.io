<circle cx="405" cy="55" r="22" fill="#ffffff" stroke="#56655d" stroke-width="2"/>
<text x="405" y="64" text-anchor="middle" fill="#16201b" font-weight="700">2</text>
<text x="439" y="63" text-anchor="start" fill="#16201b">Hambre cero</text>
