<circle cx="50" cy="289" r="22" fill="#ffffff" stroke="#b86e00" stroke-width="2"/>
<text x="50" y="298" text-anchor="middle" fill="#16201b" font-weight="700">10</text>
<text x="84" y="284" text-anchor="start" fill="#16201b">Reducción de las</text>
<text x="84" y="312" text-anchor="start" fill="#16201b">desigualdades</text>
