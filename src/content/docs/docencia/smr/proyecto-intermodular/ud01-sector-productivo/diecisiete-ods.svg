<circle cx="50" cy="367" r="22" fill="#ffffff" stroke="#b86e00" stroke-width="2"/>
<text x="50" y="376" text-anchor="middle" fill="#16201b" font-weight="700">13</text>
<text x="84" y="375" text-anchor="start" fill="#16201b">Acción por el clima</text>
