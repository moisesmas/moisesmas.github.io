<circle cx="760" cy="55" r="22" fill="#ffffff" stroke="#56655d" stroke-width="2"/>
<text x="760" y="64" text-anchor="middle" fill="#16201b" font-weight="700">3</text>
<text x="794" y="63" text-anchor="start" fill="#16201b">Salud y bienestar</text>
<rect x="20" y="98" width="350" height="70" rx="8" fill="#fbeed8" stroke="#b86e00" stroke-width="2"/>
<circle cx="50" cy="133" r="22" fill="#ffffff" stroke="#b86e00" stroke-width="2"/>
<text x="50" y="142" text-anchor="middle" fill="#16201b" font-weight="700">4</text>
<text x="84" y="141" text-anchor="start" fill="#16201b">Educación de calidad</text>
<rect x="375" y="98" width="350" height="70" rx="8" fill="#f2f4ef" stroke="#56655d" stroke-width="2"/>
<circle cx="405" cy="133" r="22" fill="#ffffff" stroke="#56655d" stroke-width="2"/>
<text x="405" y="142" text-anchor="middle" fill="#16201b" font-weight="700">5</text>
<text x="439" y="141" text-anchor="start" fill="#16201b">Igualdad de género</text>
<rect x="730" y="98" width="350" height="70" rx="8" fill="#f2f4ef" stroke="#56655d" stroke-width="2"/>
<circle cx="760" cy="133" r="22" fill="#ffffff" stroke="#56655d" stroke-width="2"/>
<text x="760" y="142" text-anchor="middle" fill="#16201b" font-weight="700">6</text>
<text x="794" y="128" text-anchor="start" fill="#16201b">Agua limpia y</text>
<text x="794" y="156" text-anchor="start" fill="#16201b">saneamiento</text>
