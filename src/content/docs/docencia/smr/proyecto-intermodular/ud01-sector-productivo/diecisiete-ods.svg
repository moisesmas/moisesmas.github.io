<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 490" width="1100" height="490" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="24" role="img" aria-labelledby="t d">
<title id="t">Los 17 Objetivos de Desarrollo Sostenible</title>
<desc id="d">Cuadrícula con los 17 ODS numerados: 1 Fin de la pobreza, 2 Hambre cero, 3 Salud y bienestar, 4 Educación de calidad, 5 Igualdad de género, 6 Agua limpia y saneamiento, 7 Energía asequible y no contaminante, 8 Trabajo decente y crecimiento económico, 9 Industria, innovación e infraestructura, 10 Reducción de las desigualdades, 11 Ciudades y comunidades sostenibles, 12 Producción y consumo responsables, 13 Acción por el clima, 14 Vida submarina, 15 Vida de ecosistemas terrestres, 16 Paz, justicia e instituciones sólidas y 17 Alianzas para lograr los objetivos. Resaltados en ámbar los seis que más aparecen en el sector TIC: 4, 8, 9, 10, 12 y 13.</desc>
<defs><marker id="flecha" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#56655d"/></marker></defs>
<rect width="1100" height="490" fill="#ffffff"/>
<rect x="20" y="20" width="350" height="70" rx="8" fill="#f2f4ef" stroke="#56655d" stroke-width="2"/>
<circle cx="50" cy="55" r="22" fill="#ffffff" stroke="#56655d" stroke-width="2"/>
<text x="50" y="64" text-anchor="middle" fill="#16201b" font-weight="700">1</text>
<text x="84" y="50" text-anchor="start" fill="#16201b">Fin de la</text>
<text x="84" y="78" text-anchor="start" fill="#16201b">pobreza</text>
