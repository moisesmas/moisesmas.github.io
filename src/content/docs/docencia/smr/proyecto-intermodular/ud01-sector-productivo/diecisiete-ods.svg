<circle cx="405" cy="367" r="22" fill="#ffffff" stroke="#56655d" stroke-width="2"/>
<text x="405" y="376" text-anchor="middle" fill="#16201b" font-weight="700">14</text>
<text x="439" y="375" text-anchor="start" fill="#16201b">Vida submarina</text>
<rect x="730" y="332" width="350" height="70" rx="8" fill="#f2f4ef" stroke="#56655d" stroke-width="2"/>
<circle cx="760" cy="367" r="22" fill="#ffffff" stroke="#56655d" stroke-width="2"/>
<text x="760" y="376" text-anchor="middle" fill="#16201b" font-weight="700">15</text>
<text x="794" y="362" text-anchor="start" fill="#16201b">Vida de ecosistemas</text>
<text x="794" y="390" text-anchor="start" fill="#16201b">terrestres</text>
<rect x="20" y="410" width="350" height="70" rx="8" fill="#f2f4ef" stroke="#56655d" stroke-width="2"/>
<circle cx="50" cy="445" r="22" fill="#ffffff" stroke="#56655d" stroke-width="2"/>
<text x="50" y="454" text-anchor="middle" fill="#16201b" font-weight="700">16</text>
<text x="84" y="440" text-anchor="start" fill="#16201b">Paz, justicia e</text>
<text x="84" y="468" text-anchor="start" fill="#16201b">instituciones sólidas</text>
<rect x="375" y="410" width="350" height="70" rx="8" fill="#f2f4ef" stroke="#56655d" stroke-width="2"/>
<circle cx="405" cy="445" r="22" fill="#ffffff" stroke="#56655d" stroke-width="2"/>
<text x="405" y="454" text-anchor="middle" fill="#16201b" font-weight="700">17</text>
<text x="439" y="440" text-anchor="start" fill="#16201b">Alianzas para lograr</text>
<text x="439" y="468" text-anchor="start" fill="#16201b">los objetivos</text>
<rect x="730" y="410" width="350" height="70" rx="8" fill="#ffffff" stroke="#b86e00" stroke-width="2" stroke-dasharray="8 6"/>
<text x="905" y="440" text-anchor="middle" fill="#16201b">Resaltados: los que más</text>
<text x="905" y="468" text-anchor="middle" fill="#16201b">aparecen en el sector TIC</text>
