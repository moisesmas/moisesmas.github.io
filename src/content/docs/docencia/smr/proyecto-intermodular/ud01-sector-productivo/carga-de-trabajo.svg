<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 470" width="1100" height="470" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="24" role="img" aria-labelledby="t d">
<title id="t">Cómo se calcula la carga de trabajo</title>
<desc id="d">Las horas demandadas (clientes por horas por cliente) se dividen entre las horas disponibles (técnicos por horas útiles por técnico) y dan la carga de trabajo. En el ejemplo, 2.860 entre 4.500 es aproximadamente 63,6 %. Una barra de 0 a 120 % marca tres zonas: por debajo del 50 % hay infrautilización, entre el 50 y el 85 % la carga es equilibrada y por encima del 85 % hay riesgo de sobrecarga.</desc>
<defs><marker id="flecha" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#56655d"/></marker></defs>
<rect width="1100" height="470" fill="#ffffff"/>
<rect x="20" y="20" width="380" height="90" rx="8" fill="#fbeed8" stroke="#b86e00" stroke-width="2"/>
<text x="210.0" y="58.0" text-anchor="middle" fill="#16201b" font-size="28" font-weight="700">Horas demandadas</text>
<text x="210.0" y="90.0" text-anchor="middle" fill="#16201b">clientes × horas por cliente</text>
<rect x="20" y="130" width="380" height="90" rx="8" fill="#e3ece7" stroke="#1f5244" stroke-width="2"/>
<text x="210.0" y="168.0" text-anchor="middle" fill="#16201b" font-size="28" font-weight="700">Horas disponibles</text>
<text x="210.0" y="200.0" text-anchor="middle" fill="#16201b">técnicos × horas útiles</text>
<path d="M402 65 L470 105 L470 112" fill="none" stroke="#56655d" stroke-width="3" marker-end="url(#flecha)"/>
<path d="M402 175 L470 135 L470 128" fill="none" stroke="#56655d" stroke-width="3" marker-end="url(#flecha)"/>
<rect x="430" y="70" width="330" height="110" rx="8" fill="#f2f4ef" stroke="#56655d" stroke-width="2"/>
<text x="595.0" y="118.0" text-anchor="middle" fill="#16201b" font-size="28" font-weight="700">Carga de trabajo</text>
<text x="595.0" y="150.0" text-anchor="middle" fill="#16201b">demandadas ÷ disponibles</text>
<line x1="762" y1="125" x2="818" y2="125" stroke="#56655d" stroke-width="3" marker-end="url(#flecha)"/>
<rect x="820" y="70" width="260" height="110" rx="8" fill="#ffffff" stroke="#56655d" stroke-width="2"/>
<text x="950.0" y="118.0" text-anchor="middle" fill="#16201b" font-size="28" font-weight="700">2.860 ÷ 4.500</text>
<text x="950.0" y="150.0" text-anchor="middle" fill="#16201b">≈ 63,6 %</text>
<rect x="20.0" y="300" width="441.6666666666667" height="70" fill="#f2f4ef" stroke="#56655d" stroke-width="2"/>
<rect x="461.6666666666667" y="300" width="309.1666666666667" height="70" fill="#e3ece7" stroke="#1f5244" stroke-width="2"/>
<rect x="770.8333333333334" y="300" width="309.16666666666663" height="70" fill="#fbeed8" stroke="#b86e00" stroke-width="2"/>
<text x="240.83333333333334" y="344" text-anchor="middle" fill="#16201b" font-weight="700">Infrautilización</text>
<text x="616.25" y="344" text-anchor="middle" fill="#16201b" font-weight="700">Equilibrada</text>
<text x="925.4166666666667" y="344" text-anchor="middle" fill="#16201b" font-weight="700">Sobrecarga</text>
<text x="20.0" y="404" text-anchor="start" fill="#16201b">0 %</text>
<text x="461.6666666666667" y="404" text-anchor="middle" fill="#16201b">50 %</text>
<text x="770.8333333333334" y="404" text-anchor="middle" fill="#16201b">85 %</text>
<text x="903.3333333333334" y="404" text-anchor="middle" fill="#16201b">100 %</text>
<path d="M581.8 296 l-12 -24 h24 z" fill="#16201b"/>
<text x="581.8" y="258" text-anchor="middle" fill="#16201b" font-size="28" font-weight="700">63,6 %</text>
<text x="550" y="450" text-anchor="middle" fill="#16201b">Umbrales orientativos: convención de la unidad</text>
</svg>
