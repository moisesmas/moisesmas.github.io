<text x="143.0" y="285.0" text-anchor="middle" fill="#16201b" font-weight="700">8 h</text>
<line x1="143" y1="310" x2="143" y2="320" stroke="#56655d" stroke-width="3"/>
<rect x="20" y="320" width="246" height="80" rx="8" fill="#f2f4ef" stroke="#56655d" stroke-width="2"/>
<text x="143.0" y="353.0" text-anchor="middle" fill="#16201b">Política de copias</text>
