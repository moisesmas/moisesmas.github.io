<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 510" width="1100" height="510" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="24" role="img" aria-labelledby="t d">
<title id="t">EDT del proyecto de copias de seguridad</title>
<desc id="d">Árbol de descomposición del trabajo. Arriba, el proyecto de copias. Debajo, cuatro fases. Diseño: inventario de datos, 8 horas, y política de copias, 6 horas. Despliegue: almacenamiento, 20 horas, y copia externa, 6 horas. Pruebas: restauración de prueba, 8 horas. Entrega: formación y manual, 6 horas, y gestión y cierre, 4 horas. Total, 58 horas.</desc>
