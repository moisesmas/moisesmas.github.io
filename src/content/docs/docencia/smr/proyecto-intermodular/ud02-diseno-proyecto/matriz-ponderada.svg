<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 440" width="1100" height="440" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="24" role="img" aria-labelledby="t d">
<title id="t">Matriz de decisión ponderada con tres ideas</title>
<desc id="d">Tabla con cuatro criterios y sus pesos: necesidad cubierta 40, viabilidad técnica 30, coste y recursos 20, innovación 10. Puntuaciones de 1 a 5 para tres ideas. Idea A, copias: 5, 4, 3 y 3, con puntuación ponderada 4,1. Idea B, monitorización: 3, 4, 3 y 3, con 3,3. Idea C, teletrabajo: 4, 3, 3 y 4, con 3,5. Gana la idea A.</desc>
