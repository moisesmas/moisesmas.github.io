<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 380" width="1100" height="380" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="24" role="img" aria-labelledby="t d">
<title id="t">Del coste directo al total con IVA</title>
<desc id="d">Ocho pasos en dos filas. Primera fila: costes directos 3.674,00 euros; más costes indirectos del 10 por ciento, 367,40; más contingencia del 5 por ciento, 202,07; igual al coste total, 4.243,47. Segunda fila: más margen comercial del 15 por ciento, 636,52; igual a la base imponible, 4.879,99; más IVA del 21 por ciento, 1.024,80; igual al total con IVA, 5.904,79 euros.</desc>
<defs><marker id="flecha" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#56655d"/></marker></defs>
<rect width="1100" height="380" fill="#ffffff"/>
<rect x="20" y="20" width="240" height="130" rx="8" fill="#e3ece7" stroke="#1f5244" stroke-width="2"/>
<text x="140.0" y="78.0" text-anchor="middle" fill="#16201b">Costes directos</text>
<text x="140.0" y="110.0" text-anchor="middle" fill="#16201b" font-size="28" font-weight="700">3.674,00 €</text>
<line x1="263" y1="85" x2="290" y2="85" stroke="#56655d" stroke-width="3" marker-end="url(#flecha)"/>
<rect x="293" y="20" width="240" height="130" rx="8" fill="#f2f4ef" stroke="#56655d" stroke-width="2"/>
<text x="413.0" y="62.0" text-anchor="middle" fill="#16201b">+ Indirectos</text>
<text x="413.0" y="94.0" text-anchor="middle" fill="#16201b">10 %</text>
<text x="413.0" y="126.0" text-anchor="middle" fill="#16201b" font-size="28" font-weight="700">367,40 €</text>
<line x1="536" y1="85" x2="563" y2="85" stroke="#56655d" stroke-width="3" marker-end="url(#flecha)"/>
<rect x="566" y="20" width="240" height="130" rx="8" fill="#f2f4ef" stroke="#56655d" stroke-width="2"/>
<text x="686.0" y="62.0" text-anchor="middle" fill="#16201b">+ Contingencia</text>
<text x="686.0" y="94.0" text-anchor="middle" fill="#16201b">5 %</text>
<text x="686.0" y="126.0" text-anchor="middle" fill="#16201b" font-size="28" font-weight="700">202,07 €</text>
<line x1="809" y1="85" x2="836" y2="85" stroke="#56655d" stroke-width="3" marker-end="url(#flecha)"/>
<rect x="839" y="20" width="240" height="130" rx="8" fill="#e3ece7" stroke="#1f5244" stroke-width="2"/>
<text x="959.0" y="78.0" text-anchor="middle" fill="#16201b">= Coste total</text>
<text x="959.0" y="110.0" text-anchor="middle" fill="#16201b" font-size="28" font-weight="700">4.243,47 €</text>
<rect x="20" y="200" width="240" height="130" rx="8" fill="#f2f4ef" stroke="#56655d" stroke-width="2"/>
<text x="140.0" y="242.0" text-anchor="middle" fill="#16201b">+ Margen</text>
<text x="140.0" y="274.0" text-anchor="middle" fill="#16201b">15 %</text>
<text x="140.0" y="306.0" text-anchor="middle" fill="#16201b" font-size="28" font-weight="700">636,52 €</text>
<line x1="263" y1="265" x2="290" y2="265" stroke="#56655d" stroke-width="3" marker-end="url(#flecha)"/>
<rect x="293" y="200" width="240" height="130" rx="8" fill="#e3ece7" stroke="#1f5244" stroke-width="2"/>
<text x="413.0" y="258.0" text-anchor="middle" fill="#16201b">= Base imponible</text>
<text x="413.0" y="290.0" text-anchor="middle" fill="#16201b" font-size="28" font-weight="700">4.879,99 €</text>
<line x1="536" y1="265" x2="563" y2="265" stroke="#56655d" stroke-width="3" marker-end="url(#flecha)"/>
<rect x="566" y="200" width="240" height="130" rx="8" fill="#f2f4ef" stroke="#56655d" stroke-width="2"/>
<text x="686.0" y="242.0" text-anchor="middle" fill="#16201b">+ IVA</text>
<text x="686.0" y="274.0" text-anchor="middle" fill="#16201b">21 %</text>
<text x="686.0" y="306.0" text-anchor="middle" fill="#16201b" font-size="28" font-weight="700">1.024,80 €</text>
<line x1="809" y1="265" x2="836" y2="265" stroke="#56655d" stroke-width="3" marker-end="url(#flecha)"/>
<rect x="839" y="200" width="240" height="130" rx="8" fill="#fbeed8" stroke="#b86e00" stroke-width="2"/>
<text x="959.0" y="258.0" text-anchor="middle" fill="#16201b">= Total con IVA</text>
<text x="959.0" y="290.0" text-anchor="middle" fill="#16201b" font-size="28" font-weight="700">5.904,79 €</text>
</svg>
