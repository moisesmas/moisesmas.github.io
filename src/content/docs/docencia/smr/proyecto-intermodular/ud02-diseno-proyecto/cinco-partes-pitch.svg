<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 450" width="1100" height="450" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="24" role="img" aria-labelledby="t d">
<title id="t">Las cinco partes de una presentación breve</title>
<desc id="d">Cinco partes en orden. Uno, problema: qué duele y a quién. Dos, solución: qué proponéis. Tres, valor y diferencial: por qué esta y no otra. Cuatro, coste y plazo: cuánto cuesta y cuánto tarda. Cinco, petición: qué queréis del público.</desc>
<defs><marker id="flecha" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#56655d"/></marker></defs>
<rect width="1100" height="450" fill="#ffffff"/>
<rect x="20" y="20" width="1060" height="70" rx="8" fill="#ffffff" stroke="#1f5244" stroke-width="2"/>
<rect x="20" y="20" width="400" height="70" rx="8" fill="#e3ece7" stroke="#1f5244" stroke-width="2"/>
<circle cx="62" cy="55" r="22" fill="#ffffff" stroke="#1f5244" stroke-width="2"/>
<text x="62" y="64" text-anchor="middle" fill="#16201b" font-weight="700">1</text>
<text x="100" y="64" text-anchor="start" fill="#16201b" font-size="28" font-weight="700">Problema</text>
<text x="444" y="64" text-anchor="start" fill="#16201b">¿Qué duele y a quién?</text>
<rect x="20" y="104" width="1060" height="70" rx="8" fill="#ffffff" stroke="#1f5244" stroke-width="2"/>
<rect x="20" y="104" width="400" height="70" rx="8" fill="#e3ece7" stroke="#1f5244" stroke-width="2"/>
<circle cx="62" cy="139" r="22" fill="#ffffff" stroke="#1f5244" stroke-width="2"/>
<text x="62" y="148" text-anchor="middle" fill="#16201b" font-weight="700">2</text>
<text x="100" y="148" text-anchor="start" fill="#16201b" font-size="28" font-weight="700">Solución</text>
<text x="444" y="148" text-anchor="start" fill="#16201b">¿Qué proponéis?</text>
<rect x="20" y="188" width="1060" height="70" rx="8" fill="#ffffff" stroke="#1f5244" stroke-width="2"/>
<rect x="20" y="188" width="400" height="70" rx="8" fill="#e3ece7" stroke="#1f5244" stroke-width="2"/>
<circle cx="62" cy="223" r="22" fill="#ffffff" stroke="#1f5244" stroke-width="2"/>
<text x="62" y="232" text-anchor="middle" fill="#16201b" font-weight="700">3</text>
<text x="100" y="232" text-anchor="start" fill="#16201b" font-size="28" font-weight="700">Valor y diferencial</text>
<text x="444" y="232" text-anchor="start" fill="#16201b">¿Por qué esta y no otra?</text>
<rect x="20" y="272" width="1060" height="70" rx="8" fill="#ffffff" stroke="#1f5244" stroke-width="2"/>
<rect x="20" y="272" width="400" height="70" rx="8" fill="#e3ece7" stroke="#1f5244" stroke-width="2"/>
<circle cx="62" cy="307" r="22" fill="#ffffff" stroke="#1f5244" stroke-width="2"/>
<text x="62" y="316" text-anchor="middle" fill="#16201b" font-weight="700">4</text>
<text x="100" y="316" text-anchor="start" fill="#16201b" font-size="28" font-weight="700">Coste y plazo</text>
<text x="444" y="316" text-anchor="start" fill="#16201b">¿Cuánto cuesta y cuánto tarda?</text>
<rect x="20" y="356" width="1060" height="70" rx="8" fill="#ffffff" stroke="#b86e00" stroke-width="2"/>
<rect x="20" y="356" width="400" height="70" rx="8" fill="#fbeed8" stroke="#b86e00" stroke-width="2"/>
<circle cx="62" cy="391" r="22" fill="#ffffff" stroke="#b86e00" stroke-width="2"/>
<text x="62" y="400" text-anchor="middle" fill="#16201b" font-weight="700">5</text>
<text x="100" y="400" text-anchor="start" fill="#16201b" font-size="28" font-weight="700">Petición</text>
<text x="444" y="400" text-anchor="start" fill="#16201b">¿Qué queréis del público?</text>
</svg>
