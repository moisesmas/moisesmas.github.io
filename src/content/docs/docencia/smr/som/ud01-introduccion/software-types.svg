<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 470" width="1100" height="470" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="24" role="img" aria-labelledby="t d">
<title id="t">Types of software and the hardware under them</title>
<desc id="d">A stack of four layers: application software on top of system software, on top of firmware, on top of the hardware. At the side, programming software is used to create applications.</desc>
<defs><marker id="flecha" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#56655d"/></marker></defs>
<rect width="1100" height="470" fill="#ffffff"/>
<rect x="20" y="20" width="620" height="84" rx="8" fill="#fbeed8" stroke="#b86e00" stroke-width="2"/>
<text x="330.0" y="55.0" text-anchor="middle" fill="#16201b" font-weight="700">Application software</text>
<text x="330.0" y="85.0" text-anchor="middle" fill="#16201b">office, browser, games</text>
<line x1="330" y1="106" x2="330" y2="132" stroke="#56655d" stroke-width="3" marker-end="url(#flecha)"/>
<rect x="20" y="134" width="620" height="84" rx="8" fill="#e3ece7" stroke="#1f5244" stroke-width="2"/>
<text x="330.0" y="169.0" text-anchor="middle" fill="#16201b" font-weight="700">System software</text>
<text x="330.0" y="199.0" text-anchor="middle" fill="#16201b">operating system, drivers, utilities</text>
<line x1="330" y1="220" x2="330" y2="246" stroke="#56655d" stroke-width="3" marker-end="url(#flecha)"/>
<rect x="20" y="248" width="620" height="84" rx="8" fill="#f2f4ef" stroke="#56655d" stroke-width="2"/>
<text x="330.0" y="283.0" text-anchor="middle" fill="#16201b" font-weight="700">Firmware</text>
<text x="330.0" y="313.0" text-anchor="middle" fill="#16201b">UEFI/BIOS, router, TV</text>
<line x1="330" y1="334" x2="330" y2="360" stroke="#56655d" stroke-width="3" marker-end="url(#flecha)"/>
<rect x="20" y="362" width="620" height="84" rx="8" fill="#ffffff" stroke="#56655d" stroke-width="2"/>
<text x="330.0" y="397.0" text-anchor="middle" fill="#16201b" font-weight="700">Hardware</text>
<text x="330.0" y="427.0" text-anchor="middle" fill="#16201b">processor, memory, disk</text>
<rect x="700" y="20" width="380" height="84" rx="8" fill="#fbeed8" stroke="#b86e00" stroke-width="2"/>
<text x="890.0" y="55.0" text-anchor="middle" fill="#16201b" font-weight="700">Programming software</text>
<text x="890.0" y="85.0" text-anchor="middle" fill="#16201b">compiler, interpreter</text>
<line x1="698" y1="62" x2="644" y2="62" stroke="#56655d" stroke-width="3" marker-end="url(#flecha)"/>
<text x="890" y="140" text-anchor="middle" fill="#56655d">to create applications</text>
</svg>
