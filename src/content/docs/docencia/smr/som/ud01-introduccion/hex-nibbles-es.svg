<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 310" width="1100" height="310" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="24" role="img" aria-labelledby="t d">
<title id="t">Hexadecimal: un dígito es un cuarteto</title>
<desc id="d">Izquierda: el byte 1010 1111 se divide en dos cuartetos, 1010 es A y 1111 es F, así que es 0xAF, que vale 175. Derecha: 0x4F es 4 y F, que es 0100 1111.</desc>
<defs><marker id="flecha" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#56655d"/></marker></defs>
<rect width="1100" height="310" fill="#ffffff"/>
<text x="270" y="34" text-anchor="middle" fill="#16201b" font-weight="700">Binario → hexadecimal</text>
<text x="830" y="34" text-anchor="middle" fill="#16201b" font-weight="700">Hexadecimal → binario</text>
<rect x="20" y="56" width="240" height="60" rx="8" fill="#e3ece7" stroke="#1f5244" stroke-width="2"/>
<text x="140.0" y="94.0" text-anchor="middle" fill="#16201b" font-weight="700" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">1010</text>
<rect x="280" y="56" width="240" height="60" rx="8" fill="#e3ece7" stroke="#1f5244" stroke-width="2"/>
<text x="400.0" y="94.0" text-anchor="middle" fill="#16201b" font-weight="700" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">1111</text>
<line x1="140" y1="120" x2="140" y2="176" stroke="#56655d" stroke-width="3" marker-end="url(#flecha)"/>
<line x1="400" y1="120" x2="400" y2="176" stroke="#56655d" stroke-width="3" marker-end="url(#flecha)"/>
<rect x="20" y="180" width="240" height="60" rx="8" fill="#fbeed8" stroke="#b86e00" stroke-width="2"/>
<text x="140.0" y="218.0" text-anchor="middle" fill="#16201b" font-weight="700" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">A</text>
<rect x="280" y="180" width="240" height="60" rx="8" fill="#fbeed8" stroke="#b86e00" stroke-width="2"/>
<text x="400.0" y="218.0" text-anchor="middle" fill="#16201b" font-weight="700" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">F</text>
<text x="270" y="285" text-anchor="middle" fill="#16201b">0xAF = 10×16 + 15 = 175</text>
<rect x="580" y="56" width="240" height="60" rx="8" fill="#fbeed8" stroke="#b86e00" stroke-width="2"/>
<text x="700.0" y="94.0" text-anchor="middle" fill="#16201b" font-weight="700" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">4</text>
<rect x="840" y="56" width="240" height="60" rx="8" fill="#fbeed8" stroke="#b86e00" stroke-width="2"/>
<text x="960.0" y="94.0" text-anchor="middle" fill="#16201b" font-weight="700" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">F</text>
<line x1="700" y1="120" x2="700" y2="176" stroke="#56655d" stroke-width="3" marker-end="url(#flecha)"/>
<line x1="960" y1="120" x2="960" y2="176" stroke="#56655d" stroke-width="3" marker-end="url(#flecha)"/>
<rect x="580" y="180" width="240" height="60" rx="8" fill="#e3ece7" stroke="#1f5244" stroke-width="2"/>
<text x="700.0" y="218.0" text-anchor="middle" fill="#16201b" font-weight="700" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">0100</text>
<rect x="840" y="180" width="240" height="60" rx="8" fill="#e3ece7" stroke="#1f5244" stroke-width="2"/>
<text x="960.0" y="218.0" text-anchor="middle" fill="#16201b" font-weight="700" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">1111</text>
<text x="830" y="285" text-anchor="middle" fill="#16201b">0x4F = 0100 1111</text>
</svg>
