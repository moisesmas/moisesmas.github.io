<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430" width="760" height="430" role="img" aria-labelledby="t">
<title id="t">Capas de un sistema informático: usuario, aplicaciones, llamadas al sistema, núcleo, controladores de dispositivo y hardware. El usuario y las aplicaciones funcionan en modo usuario; el núcleo y los controladores, en modo núcleo.</title>
<rect width="760" height="430" fill="#ffffff"/>
<style>
text{font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;fill:#16201b;font-size:14px}
.b{font-weight:700}.s{font-size:12px;fill:#56655d}.c{text-anchor:middle}.t{font-size:16px;font-weight:700}
</style>
<defs>
<marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1f5244"/></marker>
</defs>
<rect x="150" y="20" width="380" height="52" rx="8" fill="#ffffff" stroke="#1f5244" stroke-width="2"/><text x="340.0" y="44.0" class="c b">Usuario</text><text x="340.0" y="61.0" class="c s">una persona</text>
<line x1="340" y1="72" x2="340" y2="82" stroke="#1f5244" stroke-width="2" marker-end="url(#ar)"/>
<rect x="150" y="82" width="380" height="52" rx="8" fill="#ffffff" stroke="#1f5244" stroke-width="2"/><text x="340.0" y="106.0" class="c b">Aplicaciones</text><text x="340.0" y="123.0" class="c s">navegador, editor, shell</text>
<line x1="340" y1="134" x2="340" y2="144" stroke="#1f5244" stroke-width="2" marker-end="url(#ar)"/>
<rect x="150" y="144" width="380" height="52" rx="8" fill="#fbeed8" stroke="#1f5244" stroke-width="2"/><text x="340.0" y="168.0" class="c b">Interfaz de llamadas al sistema</text><text x="340.0" y="185.0" class="c s">la puerta hacia el núcleo</text>
<line x1="340" y1="196" x2="340" y2="206" stroke="#1f5244" stroke-width="2" marker-end="url(#ar)"/>
<rect x="150" y="206" width="380" height="52" rx="8" fill="#e9ede6" stroke="#1f5244" stroke-width="2"/><text x="340.0" y="230.0" class="c b">Núcleo (kernel)</text><text x="340.0" y="247.0" class="c s">procesos, memoria, archivos, seguridad</text>
<line x1="340" y1="258" x2="340" y2="268" stroke="#1f5244" stroke-width="2" marker-end="url(#ar)"/>
<rect x="150" y="268" width="380" height="52" rx="8" fill="#e9ede6" stroke="#1f5244" stroke-width="2"/><text x="340.0" y="292.0" class="c b">Controladores de dispositivo</text><text x="340.0" y="309.0" class="c s">uno para cada tipo de dispositivo</text>
<line x1="340" y1="320" x2="340" y2="330" stroke="#1f5244" stroke-width="2" marker-end="url(#ar)"/>
<rect x="150" y="330" width="380" height="52" rx="8" fill="#d3dbd4" stroke="#1f5244" stroke-width="2"/><text x="340.0" y="354.0" class="c b">Hardware</text><text x="340.0" y="371.0" class="c s">CPU, RAM, discos, pantalla, red</text>
<path d="M552 20 H566 V134 H552" fill="none" stroke="#1f5244" stroke-width="2"/><text x="578" y="72" class="b">Modo usuario</text><text x="578" y="90" class="s">derechos limitados</text>
<path d="M552 206 H566 V320 H552" fill="none" stroke="#b86e00" stroke-width="2"/><text x="578" y="258" class="b">Modo núcleo</text><text x="578" y="276" class="s">acceso total al hardware</text>
<text x="150" y="408" class="s">Una petición baja por las capas y el resultado vuelve a subir.</text>
</svg>
