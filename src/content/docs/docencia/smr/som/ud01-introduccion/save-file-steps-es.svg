<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 460" width="1100" height="460" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="24" role="img" aria-labelledby="t d">
<title id="t">Qué ocurre al guardar un archivo</title>
<desc id="d">Cinco pasos. La aplicación hace una llamada al sistema. El núcleo comprueba permisos, busca espacio y guarda los datos en un búfer. El controlador traduce la petición para el SSD. El SSD guarda los bits y lanza una interrupción. La aplicación recupera el control y muestra «Guardado».</desc>
<defs><marker id="flecha" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#56655d"/></marker></defs>
<rect width="1100" height="460" fill="#ffffff"/>
<rect x="20" y="16" width="1060" height="66" rx="8" fill="#fbeed8" stroke="#b86e00" stroke-width="2"/>
<circle cx="68" cy="49.0" r="22" fill="#ffffff" stroke="#56655d" stroke-width="2"/>
<text x="68" y="58.0" text-anchor="middle" fill="#16201b" font-weight="700">1</text>
<text x="112" y="58.0" text-anchor="start" fill="#16201b" font-weight="700">Aplicación</text>
<text x="380" y="58.0" text-anchor="start" fill="#16201b">pide al SO escribir el archivo (llamada al sistema)</text>
<line x1="550" y1="84" x2="550" y2="100" stroke="#56655d" stroke-width="3" marker-end="url(#flecha)"/>
<rect x="20" y="102" width="1060" height="66" rx="8" fill="#e3ece7" stroke="#1f5244" stroke-width="2"/>
<circle cx="68" cy="135.0" r="22" fill="#ffffff" stroke="#56655d" stroke-width="2"/>
<text x="68" y="144.0" text-anchor="middle" fill="#16201b" font-weight="700">2</text>
<text x="112" y="144.0" text-anchor="start" fill="#16201b" font-weight="700">Núcleo</text>
<text x="380" y="144.0" text-anchor="start" fill="#16201b">comprueba permisos, busca espacio y usa un búfer</text>
<line x1="550" y1="170" x2="550" y2="186" stroke="#56655d" stroke-width="3" marker-end="url(#flecha)"/>
<rect x="20" y="188" width="1060" height="66" rx="8" fill="#e3ece7" stroke="#1f5244" stroke-width="2"/>
<circle cx="68" cy="221.0" r="22" fill="#ffffff" stroke="#56655d" stroke-width="2"/>
<text x="68" y="230.0" text-anchor="middle" fill="#16201b" font-weight="700">3</text>
<text x="112" y="230.0" text-anchor="start" fill="#16201b" font-weight="700">Controlador</text>
<text x="380" y="230.0" text-anchor="start" fill="#16201b">traduce la petición a órdenes del SSD</text>
<line x1="550" y1="256" x2="550" y2="272" stroke="#56655d" stroke-width="3" marker-end="url(#flecha)"/>
<rect x="20" y="274" width="1060" height="66" rx="8" fill="#f2f4ef" stroke="#56655d" stroke-width="2"/>
<circle cx="68" cy="307.0" r="22" fill="#ffffff" stroke="#56655d" stroke-width="2"/>
<text x="68" y="316.0" text-anchor="middle" fill="#16201b" font-weight="700">4</text>
<text x="112" y="316.0" text-anchor="start" fill="#16201b" font-weight="700">SSD</text>
<text x="380" y="316.0" text-anchor="start" fill="#16201b">guarda los bits y lanza una interrupción</text>
<line x1="550" y1="342" x2="550" y2="358" stroke="#56655d" stroke-width="3" marker-end="url(#flecha)"/>
<rect x="20" y="360" width="1060" height="66" rx="8" fill="#fbeed8" stroke="#b86e00" stroke-width="2"/>
<circle cx="68" cy="393.0" r="22" fill="#ffffff" stroke="#56655d" stroke-width="2"/>
<text x="68" y="402.0" text-anchor="middle" fill="#16201b" font-weight="700">5</text>
<text x="112" y="402.0" text-anchor="start" fill="#16201b" font-weight="700">Aplicación</text>
<text x="380" y="402.0" text-anchor="start" fill="#16201b">recupera el control y muestra «Guardado»</text>
</svg>
