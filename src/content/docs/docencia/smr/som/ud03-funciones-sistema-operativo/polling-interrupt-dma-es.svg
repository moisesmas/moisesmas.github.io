<text x="723.0" y="186.0" text-anchor="middle" fill="#16201b">libre</text>
<rect x="808" y="146" width="34" height="64" rx="8" fill="#fbeed8" stroke="#b86e00" stroke-width="2"/>
<text x="825.0" y="186.0" text-anchor="middle" fill="#16201b" font-weight="700"></text>
<rect x="842" y="146" width="170" height="64" rx="8" fill="#e3ece7" stroke="#1f5244" stroke-width="2"/>
<text x="927.0" y="186.0" text-anchor="middle" fill="#16201b">libre</text>
