<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 430" width="1100" height="430" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="24" role="img" aria-labelledby="t d">
<title id="t">A deadlock: a cycle of waiting</title>
<desc id="d">A square cycle. The printer is held by P1. P1 asks for the scanner. The scanner is held by P2. P2 asks for the printer. Nobody can continue.</desc>
<defs><marker id="flecha" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#56655d"/></marker></defs>
<rect width="1100" height="430" fill="#ffffff"/>
<rect x="60" y="30" width="260" height="80" rx="8" fill="#e3ece7" stroke="#1f5244" stroke-width="2"/>
<text x="190.0" y="78.0" text-anchor="middle" fill="#16201b" font-weight="700">Printer</text>
<rect x="780" y="30" width="260" height="80" rx="8" fill="#fbeed8" stroke="#b86e00" stroke-width="2"/>
<text x="910.0" y="78.0" text-anchor="middle" fill="#16201b" font-weight="700">P1</text>
<rect x="780" y="300" width="260" height="80" rx="8" fill="#e3ece7" stroke="#1f5244" stroke-width="2"/>
<text x="910.0" y="348.0" text-anchor="middle" fill="#16201b" font-weight="700">Scanner</text>
<rect x="60" y="300" width="260" height="80" rx="8" fill="#fbeed8" stroke="#b86e00" stroke-width="2"/>
<text x="190.0" y="348.0" text-anchor="middle" fill="#16201b" font-weight="700">P2</text>
<line x1="322" y1="70" x2="778" y2="70" stroke="#56655d" stroke-width="3" marker-end="url(#flecha)"/>
<text x="550" y="56" text-anchor="middle" fill="#16201b">held by P1</text>
<line x1="910" y1="112" x2="910" y2="298" stroke="#b86e00" stroke-width="3" stroke-dasharray="10 7" marker-end="url(#flecha)"/>
<text x="890" y="210" text-anchor="end" fill="#16201b">P1 asks for it</text>
<line x1="778" y1="340" x2="322" y2="340" stroke="#56655d" stroke-width="3" marker-end="url(#flecha)"/>
<text x="550" y="326" text-anchor="middle" fill="#16201b">held by P2</text>
<line x1="190" y1="298" x2="190" y2="112" stroke="#b86e00" stroke-width="3" stroke-dasharray="10 7" marker-end="url(#flecha)"/>
<text x="210" y="210" text-anchor="start" fill="#16201b">P2 asks for it</text>
<text x="550" y="260" text-anchor="middle" fill="#16201b" font-weight="700">Nobody can continue</text>
</svg>
