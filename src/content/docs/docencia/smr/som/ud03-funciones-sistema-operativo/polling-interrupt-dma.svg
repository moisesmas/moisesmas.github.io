<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 400" width="1100" height="400" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="24" role="img" aria-labelledby="t d">
<title id="t">CPU time while a device works: polling, interrupts and DMA</title>
<desc id="d">Example with 4 words. Polling: 24 units, the CPU is busy all the time, 0 free. Interrupts: 24 units, the CPU works 4 units, 20 free, 83 percent. DMA: 22 units, the CPU works 2 units, 20 free, 91 percent.</desc>
<defs><marker id="flecha" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#56655d"/></marker></defs>
<rect width="1100" height="400" fill="#ffffff"/>
<text x="20" y="36" text-anchor="start" fill="#56655d">Time units</text>
<text x="230" y="324" text-anchor="middle" fill="#56655d">0</text>
<text x="400" y="324" text-anchor="middle" fill="#56655d">5</text>
<text x="570" y="324" text-anchor="middle" fill="#56655d">10</text>
<text x="740" y="324" text-anchor="middle" fill="#56655d">15</text>
<text x="910" y="324" text-anchor="middle" fill="#56655d">20</text>
<text x="1046" y="324" text-anchor="middle" fill="#56655d">24</text>
<text x="20" y="82" text-anchor="start" fill="#16201b" font-weight="700">Polling</text>
<text x="20" y="110" text-anchor="start" fill="#56655d">0 free</text>
<rect x="230" y="56" width="816" height="64" rx="8" fill="#fbeed8" stroke="#b86e00" stroke-width="2"/>
<text x="638.0" y="96.0" text-anchor="middle" fill="#16201b">CPU busy waiting</text>
<text x="20" y="172" text-anchor="start" fill="#16201b" font-weight="700">Interrupts</text>
<text x="20" y="200" text-anchor="start" fill="#56655d">20 free (83 %)</text>
<rect x="230" y="146" width="170" height="64" rx="8" fill="#e3ece7" stroke="#1f5244" stroke-width="2"/>
<text x="315.0" y="186.0" text-anchor="middle" fill="#16201b">free</text>
<rect x="400" y="146" width="34" height="64" rx="8" fill="#fbeed8" stroke="#b86e00" stroke-width="2"/>
<text x="417.0" y="186.0" text-anchor="middle" fill="#16201b" font-weight="700"></text>
<rect x="434" y="146" width="170" height="64" rx="8" fill="#e3ece7" stroke="#1f5244" stroke-width="2"/>
<text x="519.0" y="186.0" text-anchor="middle" fill="#16201b">free</text>
<rect x="604" y="146" width="34" height="64" rx="8" fill="#fbeed8" stroke="#b86e00" stroke-width="2"/>
<text x="621.0" y="186.0" text-anchor="middle" fill="#16201b" font-weight="700"></text>
<rect x="638" y="146" width="170" height="64" rx="8" fill="#e3ece7" stroke="#1f5244" stroke-width="2"/>
<text x="723.0" y="186.0" text-anchor="middle" fill="#16201b">free</text>
<rect x="808" y="146" width="34" height="64" rx="8" fill="#fbeed8" stroke="#b86e00" stroke-width="2"/>
<text x="825.0" y="186.0" text-anchor="middle" fill="#16201b" font-weight="700"></text>
<rect x="842" y="146" width="170" height="64" rx="8" fill="#e3ece7" stroke="#1f5244" stroke-width="2"/>
<text x="927.0" y="186.0" text-anchor="middle" fill="#16201b">free</text>
<rect x="1012" y="146" width="34" height="64" rx="8" fill="#fbeed8" stroke="#b86e00" stroke-width="2"/>
<text x="1029.0" y="186.0" text-anchor="middle" fill="#16201b" font-weight="700"></text>
<text x="20" y="262" text-anchor="start" fill="#16201b" font-weight="700">DMA</text>
<text x="20" y="290" text-anchor="start" fill="#56655d">20 free (91 %)</text>
<rect x="230" y="236" width="34" height="64" rx="8" fill="#fbeed8" stroke="#b86e00" stroke-width="2"/>
<text x="247.0" y="276.0" text-anchor="middle" fill="#16201b" font-weight="700"></text>
<rect x="264" y="236" width="680" height="64" rx="8" fill="#e3ece7" stroke="#1f5244" stroke-width="2"/>
<text x="604.0" y="276.0" text-anchor="middle" fill="#16201b">CPU free for other processes</text>
<rect x="944" y="236" width="34" height="64" rx="8" fill="#fbeed8" stroke="#b86e00" stroke-width="2"/>
<text x="961.0" y="276.0" text-anchor="middle" fill="#16201b" font-weight="700"></text>
<rect x="230" y="352" width="26" height="26" rx="8" fill="#fbeed8" stroke="#b86e00" stroke-width="2"/>
<text x="268" y="373" text-anchor="start" fill="#16201b">CPU working</text>
<rect x="560" y="352" width="26" height="26" rx="8" fill="#e3ece7" stroke="#1f5244" stroke-width="2"/>
<text x="598" y="373" text-anchor="start" fill="#16201b">CPU free</text>
</svg>
