<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 360" width="1100" height="360" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="24" role="img" aria-labelledby="t d">
<title id="t">Reading Linux permissions: -rwxr-x---</title>
<desc id="d">The string -rwxr-x--- has four parts: the type, a dash for a file; the owner, rwx, which is 4+2+1 = 7; the group, r-x, which is 4+0+1 = 5; and others, three dashes, which is 0. The octal notation is 750.</desc>
<defs><marker id="flecha" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#56655d"/></marker></defs>
<rect width="1100" height="360" fill="#ffffff"/>
<rect x="20" y="30" width="150" height="70" rx="8" fill="#f2f4ef" stroke="#56655d" stroke-width="2"/>
<text x="95.0" y="73.0" text-anchor="middle" fill="#16201b" font-weight="700" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">-</text>
<text x="95.0" y="146" text-anchor="middle" fill="#16201b">type: file</text>
<rect x="190" y="30" width="270" height="70" rx="8" fill="#fbeed8" stroke="#b86e00" stroke-width="2"/>
<text x="325.0" y="73.0" text-anchor="middle" fill="#16201b" font-weight="700" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">rwx</text>
<text x="325.0" y="146" text-anchor="middle" fill="#16201b">owner (u)</text>
<line x1="325.0" y1="160" x2="325.0" y2="192" stroke="#56655d" stroke-width="3" marker-end="url(#flecha)"/>
<rect x="190" y="196" width="270" height="90" rx="8" fill="#e3ece7" stroke="#1f5244" stroke-width="2"/>
<text x="325.0" y="234.0" text-anchor="middle" fill="#16201b" font-weight="700">7</text>
<text x="325.0" y="264.0" text-anchor="middle" fill="#16201b">4 + 2 + 1</text>
<rect x="480" y="30" width="270" height="70" rx="8" fill="#fbeed8" stroke="#b86e00" stroke-width="2"/>
<text x="615.0" y="73.0" text-anchor="middle" fill="#16201b" font-weight="700" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">r-x</text>
<text x="615.0" y="146" text-anchor="middle" fill="#16201b">group (g)</text>
<line x1="615.0" y1="160" x2="615.0" y2="192" stroke="#56655d" stroke-width="3" marker-end="url(#flecha)"/>
<rect x="480" y="196" width="270" height="90" rx="8" fill="#e3ece7" stroke="#1f5244" stroke-width="2"/>
<text x="615.0" y="234.0" text-anchor="middle" fill="#16201b" font-weight="700">5</text>
<text x="615.0" y="264.0" text-anchor="middle" fill="#16201b">4 + 0 + 1</text>
<rect x="770" y="30" width="270" height="70" rx="8" fill="#fbeed8" stroke="#b86e00" stroke-width="2"/>
<text x="905.0" y="73.0" text-anchor="middle" fill="#16201b" font-weight="700" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">---</text>
<text x="905.0" y="146" text-anchor="middle" fill="#16201b">others (o)</text>
<line x1="905.0" y1="160" x2="905.0" y2="192" stroke="#56655d" stroke-width="3" marker-end="url(#flecha)"/>
<rect x="770" y="196" width="270" height="90" rx="8" fill="#e3ece7" stroke="#1f5244" stroke-width="2"/>
<text x="905.0" y="234.0" text-anchor="middle" fill="#16201b" font-weight="700">0</text>
<text x="905.0" y="264.0" text-anchor="middle" fill="#16201b">0 + 0 + 0</text>
<text x="550" y="328" text-anchor="middle" fill="#16201b" font-weight="700">r = 4 · w = 2 · x = 1  →  750</text>
</svg>
