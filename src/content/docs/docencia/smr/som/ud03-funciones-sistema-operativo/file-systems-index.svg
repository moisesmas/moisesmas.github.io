<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 220" width="1100" height="220" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="24" role="img" aria-labelledby="t d">
<title id="t">How three file systems find a file</title>
<desc id="d">FAT32 uses a File Allocation Table with one entry per cluster and a chain such as 5, 6, 9, end. NTFS uses a Master File Table with one record per file; very small files fit inside it. ext4 uses inodes with the attributes and the location of the data; the name is in the directory.</desc>
<defs><marker id="flecha" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#56655d"/></marker></defs>
<rect width="1100" height="220" fill="#ffffff"/>
<rect x="20" y="30" width="340" height="160" rx="8" fill="#fbeed8" stroke="#b86e00" stroke-width="2"/>
<text x="190.0" y="73.0" text-anchor="middle" fill="#16201b" font-weight="700">FAT32</text>
<text x="190.0" y="103.0" text-anchor="middle" fill="#16201b">allocation table</text>
<text x="190.0" y="133.0" text-anchor="middle" fill="#16201b">one entry per cluster</text>
<text x="190.0" y="163.0" text-anchor="middle" fill="#16201b">chain: 5 → 6 → 9 → end</text>
<rect x="380" y="30" width="340" height="160" rx="8" fill="#e3ece7" stroke="#1f5244" stroke-width="2"/>
<text x="550.0" y="73.0" text-anchor="middle" fill="#16201b" font-weight="700">NTFS</text>
<text x="550.0" y="103.0" text-anchor="middle" fill="#16201b">Master File Table</text>
<text x="550.0" y="133.0" text-anchor="middle" fill="#16201b">a record per file</text>
<text x="550.0" y="163.0" text-anchor="middle" fill="#16201b">small files fit inside</text>
<rect x="740" y="30" width="340" height="160" rx="8" fill="#f2f4ef" stroke="#56655d" stroke-width="2"/>
<text x="910.0" y="73.0" text-anchor="middle" fill="#16201b" font-weight="700">ext4</text>
<text x="910.0" y="103.0" text-anchor="middle" fill="#16201b">inodes</text>
<text x="910.0" y="133.0" text-anchor="middle" fill="#16201b">attributes and extents</text>
<text x="910.0" y="163.0" text-anchor="middle" fill="#16201b">name is in the folder</text>
</svg>
