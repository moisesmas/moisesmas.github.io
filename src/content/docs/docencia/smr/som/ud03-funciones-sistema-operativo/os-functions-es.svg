<text x="550.0" y="313.0" text-anchor="middle" fill="#16201b" font-weight="700">Gestión de la seguridad</text>
<text x="550.0" y="343.0" text-anchor="middle" fill="#16201b">¿quién puede leer, escribir o ejecutar esto?</text>
