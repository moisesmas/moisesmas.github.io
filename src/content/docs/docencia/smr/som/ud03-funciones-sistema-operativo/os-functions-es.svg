<text x="145.0" y="73.0" text-anchor="middle" fill="#16201b" font-weight="700">Gestión de</text>
<text x="145.0" y="103.0" text-anchor="middle" fill="#16201b" font-weight="700">procesos</text>
<line x1="145" y1="132" x2="145" y2="178" stroke="#56655d" stroke-width="3" marker-end="url(#flecha)"/>
<rect x="20" y="180" width="250" height="70" rx="8" fill="#f2f4ef" stroke="#56655d" stroke-width="2"/>
<text x="145.0" y="223.0" text-anchor="middle" fill="#16201b">Tiempo de CPU</text>
<rect x="290" y="30" width="250" height="100" rx="8" fill="#fbeed8" stroke="#b86e00" stroke-width="2"/>
<text x="415.0" y="73.0" text-anchor="middle" fill="#16201b" font-weight="700">Gestión de</text>
<text x="415.0" y="103.0" text-anchor="middle" fill="#16201b" font-weight="700">memoria</text>
<line x1="415" y1="132" x2="415" y2="178" stroke="#56655d" stroke-width="3" marker-end="url(#flecha)"/>
<rect x="290" y="180" width="250" height="70" rx="8" fill="#f2f4ef" stroke="#56655d" stroke-width="2"/>
<text x="415.0" y="223.0" text-anchor="middle" fill="#16201b">RAM</text>
<rect x="560" y="30" width="250" height="100" rx="8" fill="#fbeed8" stroke="#b86e00" stroke-width="2"/>
<text x="685.0" y="73.0" text-anchor="middle" fill="#16201b" font-weight="700">Gestión de</text>
<text x="685.0" y="103.0" text-anchor="middle" fill="#16201b" font-weight="700">archivos</text>
<line x1="685" y1="132" x2="685" y2="178" stroke="#56655d" stroke-width="3" marker-end="url(#flecha)"/>
<rect x="560" y="180" width="250" height="70" rx="8" fill="#f2f4ef" stroke="#56655d" stroke-width="2"/>
<text x="685.0" y="223.0" text-anchor="middle" fill="#16201b">Almacenamiento</text>
<rect x="830" y="30" width="250" height="100" rx="8" fill="#fbeed8" stroke="#b86e00" stroke-width="2"/>
<text x="955.0" y="73.0" text-anchor="middle" fill="#16201b" font-weight="700">Gestión de</text>
<text x="955.0" y="103.0" text-anchor="middle" fill="#16201b" font-weight="700">E/S</text>
<line x1="955" y1="132" x2="955" y2="178" stroke="#56655d" stroke-width="3" marker-end="url(#flecha)"/>
<rect x="830" y="180" width="250" height="70" rx="8" fill="#f2f4ef" stroke="#56655d" stroke-width="2"/>
<text x="955.0" y="223.0" text-anchor="middle" fill="#16201b">Dispositivos</text>
