<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 370" width="1100" height="370" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="24" role="img" aria-labelledby="t d">
<title id="t">Funciones del sistema operativo y los recursos que gestionan</title>
<desc id="d">Cuatro funciones, cada una gestiona un recurso: la gestión de procesos el tiempo de CPU, la de memoria la RAM, la de archivos el almacenamiento y la de E/S los dispositivos. La gestión de la seguridad abarca todos.</desc>
<defs><marker id="flecha" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#56655d"/></marker></defs>
<rect width="1100" height="370" fill="#ffffff"/>
