<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 410" width="1100" height="410" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="24" role="img" aria-labelledby="t d">
<title id="t">Memory of a process and its Process Control Block</title>
<desc id="d">Left: the memory of a process has four areas: stack, heap, data and code. Right: the PCB, the identity card of the process, with its PID, parent PID, state, priority, CPU registers, memory information and open files with owner.</desc>
<defs><marker id="flecha" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#56655d"/></marker></defs>
<rect width="1100" height="410" fill="#ffffff"/>
<text x="260" y="34" text-anchor="middle" fill="#16201b" font-weight="700">Process memory</text>
<text x="820" y="34" text-anchor="middle" fill="#16201b" font-weight="700">PCB: the identity card</text>
<rect x="20" y="54" width="480" height="78" rx="8" fill="#fbeed8" stroke="#b86e00" stroke-width="2"/>
<text x="260.0" y="86.0" text-anchor="middle" fill="#16201b" font-weight="700">Stack</text>
<text x="260.0" y="116.0" text-anchor="middle" fill="#16201b">function calls</text>
<rect x="20" y="142" width="480" height="78" rx="8" fill="#e3ece7" stroke="#1f5244" stroke-width="2"/>
<text x="260.0" y="174.0" text-anchor="middle" fill="#16201b" font-weight="700">Heap</text>
<text x="260.0" y="204.0" text-anchor="middle" fill="#16201b">memory requested while running</text>
<rect x="20" y="230" width="480" height="78" rx="8" fill="#f2f4ef" stroke="#56655d" stroke-width="2"/>
<text x="260.0" y="277.0" text-anchor="middle" fill="#16201b" font-weight="700">Data</text>
<rect x="20" y="318" width="480" height="78" rx="8" fill="#ffffff" stroke="#56655d" stroke-width="2"/>
<text x="260.0" y="350.0" text-anchor="middle" fill="#16201b" font-weight="700">Code</text>
<text x="260.0" y="380.0" text-anchor="middle" fill="#16201b">the instructions</text>
<rect x="560" y="54" width="520" height="42" rx="8" fill="#fbeed8" stroke="#b86e00" stroke-width="2"/>
<text x="820.0" y="83.0" text-anchor="middle" fill="#16201b">PID: unique number</text>
<rect x="560" y="102" width="520" height="42" rx="8" fill="#f2f4ef" stroke="#56655d" stroke-width="2"/>
<text x="820.0" y="131.0" text-anchor="middle" fill="#16201b">PPID: the parent process</text>
<rect x="560" y="150" width="520" height="42" rx="8" fill="#f2f4ef" stroke="#56655d" stroke-width="2"/>
<text x="820.0" y="179.0" text-anchor="middle" fill="#16201b">State: ready, running, waiting</text>
<rect x="560" y="198" width="520" height="42" rx="8" fill="#f2f4ef" stroke="#56655d" stroke-width="2"/>
<text x="820.0" y="227.0" text-anchor="middle" fill="#16201b">Priority</text>
<rect x="560" y="246" width="520" height="42" rx="8" fill="#f2f4ef" stroke="#56655d" stroke-width="2"/>
<text x="820.0" y="275.0" text-anchor="middle" fill="#16201b">CPU registers, program counter</text>
<rect x="560" y="294" width="520" height="42" rx="8" fill="#f2f4ef" stroke="#56655d" stroke-width="2"/>
<text x="820.0" y="323.0" text-anchor="middle" fill="#16201b">Memory information</text>
<rect x="560" y="342" width="520" height="42" rx="8" fill="#f2f4ef" stroke="#56655d" stroke-width="2"/>
<text x="820.0" y="371.0" text-anchor="middle" fill="#16201b">Open files, owner</text>
</svg>
