<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 360" width="1100" height="360" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="24" role="img" aria-labelledby="t d">
<title id="t">Do not over-assign: leave resources for the host</title>
<desc id="d">Host memory bar split in three: the host keeps 2 to 3 GB or more, the running VMs stay in the green zone, and the red zone is too much. Below, two rules: never give a VM more vCPUs than the host has cores, and check the free disk space of the host.</desc>
<defs><marker id="flecha" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#56655d"/></marker></defs>
<rect width="1100" height="360" fill="#ffffff"/>
<text x="20" y="44" text-anchor="start" fill="#16201b" font-size="28" font-weight="700">Host memory</text>
<rect x="20" y="64" width="300" height="90" rx="8" fill="#f2f4ef" stroke="#56655d" stroke-width="2"/>
<text x="170.0" y="103.0" text-anchor="middle" fill="#16201b" font-weight="700">Host</text>
<text x="170.0" y="131.0" text-anchor="middle" fill="#16201b">2–3 GB or more</text>
<rect x="320" y="64" width="520" height="90" rx="8" fill="#e3ece7" stroke="#1f5244" stroke-width="2"/>
<text x="580.0" y="103.0" text-anchor="middle" fill="#16201b" font-weight="700">Running VMs</text>
<text x="580.0" y="131.0" text-anchor="middle" fill="#16201b">stay in the green zone</text>
<rect x="840" y="64" width="240" height="90" rx="8" fill="#fbeed8" stroke="#b86e00" stroke-width="2"/>
<text x="960.0" y="103.0" text-anchor="middle" fill="#16201b" font-weight="700">Red zone</text>
<text x="960.0" y="131.0" text-anchor="middle" fill="#16201b">too much</text>
<rect x="20" y="190" width="520" height="130" rx="8" fill="#f2f4ef" stroke="#56655d" stroke-width="2"/>
<text x="280.0" y="235.0" text-anchor="middle" fill="#16201b" font-weight="700">vCPU</text>
<text x="280.0" y="263.0" text-anchor="middle" fill="#16201b">never more than the</text>
<text x="280.0" y="291.0" text-anchor="middle" fill="#16201b">host's cores (1–2 is enough)</text>
<rect x="560" y="190" width="520" height="130" rx="8" fill="#f2f4ef" stroke="#56655d" stroke-width="2"/>
<text x="820.0" y="235.0" text-anchor="middle" fill="#16201b" font-weight="700">Disk</text>
<text x="820.0" y="263.0" text-anchor="middle" fill="#16201b">the virtual disk lives on the</text>
<text x="820.0" y="291.0" text-anchor="middle" fill="#16201b">host disk: check free space</text>
</svg>
