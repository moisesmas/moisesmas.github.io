<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 500" width="1100" height="500" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="24" role="img" aria-labelledby="t d">
<title id="t">Quién puede hablar con quién en cada modo de red</title>
<desc id="d">Tabla de los cinco modos de red de VirtualBox. NAT: la VM llega a Internet y al anfitrión; el anfitrión y la LAN llegan a ella solo con redirección de puertos; las VM no se ven entre sí. Puente: todo está conectado. Solo anfitrión: sin Internet ni LAN. Red interna: solo hablan las VM entre sí. Red NAT: como NAT, pero las VM se ven entre sí.</desc>
<defs><marker id="flecha" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#56655d"/></marker></defs>
