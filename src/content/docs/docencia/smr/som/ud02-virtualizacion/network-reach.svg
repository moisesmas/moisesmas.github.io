<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 500" width="1100" height="500" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="24" role="img" aria-labelledby="t d">
<title id="t">Who can talk to whom in each network mode</title>
<desc id="d">Table of the five network modes of VirtualBox. NAT: the VM reaches the Internet and the host; the host and the LAN reach it only through port forwarding; VMs do not see each other. Bridged: everything is connected. Host-only: no Internet, no LAN. Internal: only VMs talk to each other. NAT Network: like NAT, but VMs see each other.</desc>
<defs><marker id="flecha" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#56655d"/></marker></defs>
