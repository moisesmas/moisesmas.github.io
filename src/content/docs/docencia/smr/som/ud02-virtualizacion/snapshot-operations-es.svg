<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 520" width="1100" height="520" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="24" role="img" aria-labelledby="t d">
<title id="t">Tomar, restaurar y eliminar una instantánea</title>
<desc id="d">Tres columnas con la pila de capas de disco antes y después. Tomar: se crea una capa nueva encima y la VM escribe en ella. Restaurar: se descartan los cambios hechos después de la instantánea. Eliminar: la capa de la instantánea se fusiona con la vecina, así que no se pierden datos.</desc>
<defs><marker id="flecha" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#56655d"/></marker></defs>
<rect width="1100" height="520" fill="#ffffff"/>
<text x="190" y="40" text-anchor="middle" fill="#16201b" font-size="28" font-weight="700">Tomar</text>
<rect x="40" y="62" width="300" height="46" rx="8" fill="#fbeed8" stroke="#b86e00" stroke-width="2"/>
<text x="190.0" y="93.0" text-anchor="middle" fill="#16201b">Estado actual</text>
<rect x="40" y="114" width="300" height="46" rx="8" fill="#f2f4ef" stroke="#56655d" stroke-width="2"/>
<text x="190.0" y="145.0" text-anchor="middle" fill="#16201b">Disco base</text>
<line x1="190" y1="222" x2="190" y2="262" stroke="#56655d" stroke-width="3" marker-end="url(#flecha)"/>
<rect x="40" y="270" width="300" height="46" rx="8" fill="#fbeed8" stroke="#b86e00" stroke-width="2"/>
<text x="190.0" y="301.0" text-anchor="middle" fill="#16201b">Estado actual</text>
<rect x="40" y="322" width="300" height="46" rx="8" fill="#e3ece7" stroke="#1f5244" stroke-width="2"/>
<text x="190.0" y="353.0" text-anchor="middle" fill="#16201b">Instantánea 1</text>
<rect x="40" y="374" width="300" height="46" rx="8" fill="#f2f4ef" stroke="#56655d" stroke-width="2"/>
<text x="190.0" y="405.0" text-anchor="middle" fill="#16201b">Disco base</text>
<rect x="20" y="450" width="340" height="48" rx="24" fill="#ffffff" stroke="#b86e00" stroke-width="2"/>
<text x="190.0" y="482" text-anchor="middle" fill="#5c3700" font-weight="700">Una capa nueva encima</text>
<text x="550" y="40" text-anchor="middle" fill="#16201b" font-size="28" font-weight="700">Restaurar</text>
<rect x="400" y="62" width="300" height="46" rx="8" fill="#fbeed8" stroke="#b86e00" stroke-width="2"/>
<text x="550.0" y="93.0" text-anchor="middle" fill="#16201b">Actual + trabajo nuevo</text>
<rect x="400" y="114" width="300" height="46" rx="8" fill="#e3ece7" stroke="#1f5244" stroke-width="2"/>
<text x="550.0" y="145.0" text-anchor="middle" fill="#16201b">Instantánea 1</text>
<rect x="400" y="166" width="300" height="46" rx="8" fill="#f2f4ef" stroke="#56655d" stroke-width="2"/>
<text x="550.0" y="197.0" text-anchor="middle" fill="#16201b">Disco base</text>
<line x1="550" y1="222" x2="550" y2="262" stroke="#56655d" stroke-width="3" marker-end="url(#flecha)"/>
<rect x="400" y="270" width="300" height="46" rx="8" fill="#fbeed8" stroke="#b86e00" stroke-width="2" stroke-dasharray="8 6"/>
<text x="550.0" y="301.0" text-anchor="middle" fill="#16201b">Actual (limpio)</text>
<rect x="400" y="322" width="300" height="46" rx="8" fill="#e3ece7" stroke="#1f5244" stroke-width="2"/>
<text x="550.0" y="353.0" text-anchor="middle" fill="#16201b">Instantánea 1</text>
<rect x="400" y="374" width="300" height="46" rx="8" fill="#f2f4ef" stroke="#56655d" stroke-width="2"/>
<text x="550.0" y="405.0" text-anchor="middle" fill="#16201b">Disco base</text>
<rect x="380" y="450" width="340" height="48" rx="24" fill="#ffffff" stroke="#b86e00" stroke-width="2"/>
<text x="550.0" y="482" text-anchor="middle" fill="#5c3700" font-weight="700">Se pierde lo posterior</text>
<text x="910" y="40" text-anchor="middle" fill="#16201b" font-size="28" font-weight="700">Eliminar</text>
<rect x="760" y="62" width="300" height="46" rx="8" fill="#fbeed8" stroke="#b86e00" stroke-width="2"/>
<text x="910.0" y="93.0" text-anchor="middle" fill="#16201b">Estado actual</text>
<rect x="760" y="114" width="300" height="46" rx="8" fill="#e3ece7" stroke="#1f5244" stroke-width="2"/>
<text x="910.0" y="145.0" text-anchor="middle" fill="#16201b">Instantánea 1</text>
<rect x="760" y="166" width="300" height="46" rx="8" fill="#f2f4ef" stroke="#56655d" stroke-width="2"/>
<text x="910.0" y="197.0" text-anchor="middle" fill="#16201b">Disco base</text>
<line x1="910" y1="222" x2="910" y2="262" stroke="#56655d" stroke-width="3" marker-end="url(#flecha)"/>
<rect x="760" y="270" width="300" height="46" rx="8" fill="#fbeed8" stroke="#b86e00" stroke-width="2"/>
<text x="910.0" y="301.0" text-anchor="middle" fill="#16201b">Estado actual</text>
<rect x="760" y="322" width="300" height="46" rx="8" fill="#e3ece7" stroke="#1f5244" stroke-width="2"/>
<text x="910.0" y="353.0" text-anchor="middle" fill="#16201b">Base + Instantánea 1</text>
<rect x="740" y="450" width="340" height="48" rx="24" fill="#ffffff" stroke="#b86e00" stroke-width="2"/>
<text x="910.0" y="482" text-anchor="middle" fill="#5c3700" font-weight="700">Capas fusionadas</text>
</svg>
