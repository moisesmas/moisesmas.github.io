<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 330" width="1100" height="330" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="24" role="img" aria-labelledby="t d">
<title id="t">Seis reglas para comparar con justicia</title>
<desc id="d">Seis cajas en orden: 1 misma prueba y mismo tamaño en anfitrión e invitado; 2 sistema tranquilo, con otros programas y VM cerrados; 3 repetir tres veces y usar la mediana; 4 condiciones iguales en la prueba de CPU; 5 anotarlo todo; 6 calcular el rendimiento relativo como resultado del invitado entre resultado del anfitrión por 100.</desc>
<defs><marker id="flecha" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#56655d"/></marker></defs>
<rect width="1100" height="330" fill="#ffffff"/>
<rect x="20" y="20" width="340" height="120" rx="8" fill="#fbeed8" stroke="#b86e00" stroke-width="2"/>
<text x="190.0" y="74.0" text-anchor="middle" fill="#16201b" font-weight="700">1. Misma prueba</text>
<text x="190.0" y="102.0" text-anchor="middle" fill="#16201b">mismo tamaño en ambos</text>
<rect x="380" y="20" width="340" height="120" rx="8" fill="#fbeed8" stroke="#b86e00" stroke-width="2"/>
<text x="550.0" y="74.0" text-anchor="middle" fill="#16201b" font-weight="700">2. Sistema tranquilo</text>
<text x="550.0" y="102.0" text-anchor="middle" fill="#16201b">cierra apps y otras VM</text>
<rect x="740" y="20" width="340" height="120" rx="8" fill="#fbeed8" stroke="#b86e00" stroke-width="2"/>
<text x="910.0" y="74.0" text-anchor="middle" fill="#16201b" font-weight="700">3. Repite</text>
<text x="910.0" y="102.0" text-anchor="middle" fill="#16201b">3 veces y usa la mediana</text>
<rect x="20" y="180" width="340" height="120" rx="8" fill="#fbeed8" stroke="#b86e00" stroke-width="2"/>
<text x="190.0" y="234.0" text-anchor="middle" fill="#16201b" font-weight="700">4. CPU en igualdad</text>
<text x="190.0" y="262.0" text-anchor="middle" fill="#16201b">hilos = vCPU del invitado</text>
<rect x="380" y="180" width="340" height="120" rx="8" fill="#fbeed8" stroke="#b86e00" stroke-width="2"/>
<text x="550.0" y="234.0" text-anchor="middle" fill="#16201b" font-weight="700">5. Anótalo todo</text>
<text x="550.0" y="262.0" text-anchor="middle" fill="#16201b">anfitrión, VM y órdenes</text>
<rect x="740" y="180" width="340" height="120" rx="8" fill="#e3ece7" stroke="#1f5244" stroke-width="2"/>
<text x="910.0" y="234.0" text-anchor="middle" fill="#16201b" font-weight="700">6. Compara</text>
<text x="910.0" y="262.0" text-anchor="middle" fill="#16201b">rendimiento relativo</text>
</svg>
