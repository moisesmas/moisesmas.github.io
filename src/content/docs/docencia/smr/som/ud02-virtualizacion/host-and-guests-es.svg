<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 430" width="1100" height="430" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="24" role="img" aria-labelledby="t d">
<title id="t">Un anfitrión ejecuta varias máquinas virtuales</title>
<desc id="d">Tres máquinas virtuales, cada una con un sistema operativo invitado y CPU, memoria y disco virtuales, funcionan sobre el hipervisor. El hipervisor reparte entre ellas el hardware real del anfitrión, el ordenador físico.</desc>
<defs><marker id="flecha" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#56655d"/></marker></defs>
<rect width="1100" height="430" fill="#ffffff"/>
<rect x="20" y="20" width="340" height="120" rx="8" fill="#fbeed8" stroke="#b86e00" stroke-width="2"/>
<text x="190.0" y="60.0" text-anchor="middle" fill="#16201b" font-weight="700">Máquina virtual 1</text>
<text x="190.0" y="88.0" text-anchor="middle" fill="#16201b">SO invitado</text>
<text x="190.0" y="116.0" text-anchor="middle" fill="#16201b">vCPU · memoria · disco</text>
<line x1="190" y1="144" x2="190" y2="172" stroke="#56655d" stroke-width="3" marker-end="url(#flecha)"/>
<rect x="380" y="20" width="340" height="120" rx="8" fill="#fbeed8" stroke="#b86e00" stroke-width="2"/>
<text x="550.0" y="60.0" text-anchor="middle" fill="#16201b" font-weight="700">Máquina virtual 2</text>
<text x="550.0" y="88.0" text-anchor="middle" fill="#16201b">SO invitado</text>
<text x="550.0" y="116.0" text-anchor="middle" fill="#16201b">vCPU · memoria · disco</text>
<line x1="550" y1="144" x2="550" y2="172" stroke="#56655d" stroke-width="3" marker-end="url(#flecha)"/>
<rect x="740" y="20" width="340" height="120" rx="8" fill="#fbeed8" stroke="#b86e00" stroke-width="2"/>
<text x="910.0" y="60.0" text-anchor="middle" fill="#16201b" font-weight="700">Máquina virtual 3</text>
<text x="910.0" y="88.0" text-anchor="middle" fill="#16201b">SO invitado</text>
<text x="910.0" y="116.0" text-anchor="middle" fill="#16201b">vCPU · memoria · disco</text>
<line x1="910" y1="144" x2="910" y2="172" stroke="#56655d" stroke-width="3" marker-end="url(#flecha)"/>
<rect x="20" y="176" width="1060" height="90" rx="8" fill="#f2f4ef" stroke="#56655d" stroke-width="2"/>
<text x="550.0" y="215.0" text-anchor="middle" fill="#16201b" font-weight="700">Hipervisor</text>
<text x="550.0" y="243.0" text-anchor="middle" fill="#16201b">reparte el hardware real entre las VM</text>
<line x1="550" y1="270" x2="550" y2="298" stroke="#56655d" stroke-width="3" marker-end="url(#flecha)"/>
<rect x="20" y="302" width="1060" height="100" rx="8" fill="#e3ece7" stroke="#1f5244" stroke-width="2"/>
<text x="550.0" y="346.0" text-anchor="middle" fill="#16201b" font-weight="700">Anfitrión: el ordenador físico</text>
<text x="550.0" y="374.0" text-anchor="middle" fill="#16201b">CPU · memoria · discos · tarjeta de red</text>
</svg>
