<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 330" width="1100" height="330" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="24" role="img" aria-labelledby="t d">
<title id="t">Six rules for a fair comparison</title>
<desc id="d">Six boxes in order: 1 same test and same size on host and guest; 2 quiet system, with other programs and VMs closed; 3 repeat three times and use the median; 4 equal conditions in the CPU test; 5 write everything down; 6 calculate the relative performance as guest result divided by host result times 100.</desc>
<defs><marker id="flecha" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#56655d"/></marker></defs>
<rect width="1100" height="330" fill="#ffffff"/>
<rect x="20" y="20" width="340" height="120" rx="8" fill="#fbeed8" stroke="#b86e00" stroke-width="2"/>
<text x="190.0" y="74.0" text-anchor="middle" fill="#16201b" font-weight="700">1. Same test</text>
<text x="190.0" y="102.0" text-anchor="middle" fill="#16201b">same size on both</text>
<rect x="380" y="20" width="340" height="120" rx="8" fill="#fbeed8" stroke="#b86e00" stroke-width="2"/>
<text x="550.0" y="74.0" text-anchor="middle" fill="#16201b" font-weight="700">2. Quiet system</text>
<text x="550.0" y="102.0" text-anchor="middle" fill="#16201b">close apps and other VMs</text>
<rect x="740" y="20" width="340" height="120" rx="8" fill="#fbeed8" stroke="#b86e00" stroke-width="2"/>
<text x="910.0" y="74.0" text-anchor="middle" fill="#16201b" font-weight="700">3. Repeat</text>
<text x="910.0" y="102.0" text-anchor="middle" fill="#16201b">3 runs, take the median</text>
<rect x="20" y="180" width="340" height="120" rx="8" fill="#fbeed8" stroke="#b86e00" stroke-width="2"/>
<text x="190.0" y="234.0" text-anchor="middle" fill="#16201b" font-weight="700">4. Equal CPU test</text>
<text x="190.0" y="262.0" text-anchor="middle" fill="#16201b">threads = guest vCPUs</text>
<rect x="380" y="180" width="340" height="120" rx="8" fill="#fbeed8" stroke="#b86e00" stroke-width="2"/>
<text x="550.0" y="234.0" text-anchor="middle" fill="#16201b" font-weight="700">5. Write it down</text>
<text x="550.0" y="262.0" text-anchor="middle" fill="#16201b">host, VM and commands</text>
<rect x="740" y="180" width="340" height="120" rx="8" fill="#e3ece7" stroke="#1f5244" stroke-width="2"/>
<text x="910.0" y="234.0" text-anchor="middle" fill="#16201b" font-weight="700">6. Compare</text>
<text x="910.0" y="262.0" text-anchor="middle" fill="#16201b">relative performance</text>
</svg>
